version: v2
clean: true

managed:
  enabled: false

inputs:
  - directory: proto

plugins:
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: gen/ts
    opt:
      - esModuleInterop=true
      - useOptionals=messages
      - outputServices=none
      - outputJsonMethods=true
    strategy: all
    include_imports: true
