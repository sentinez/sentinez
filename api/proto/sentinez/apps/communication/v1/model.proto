syntax = "proto3";

package sentinez.apps.communication.v1;
option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/communication/v1;communicationpb";

import "buf/validate/validate.proto";
import "sentinez/types/notify/v1/notify.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

// Notification is a message pushed to the console, stored for its tenant.
message Notification {
  option (sentinez.types.v1.x_message) = {
    database_model: true
    scanner: true
  };
  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];

  string id = 2 [(buf.validate.field).string.prefix = "ntf_"];

  sentinez.types.notify.v1.Notification event = 3;

  string tenant_id = 4 [
    (sentinez.types.v1.x_field).audit.tenant_id = true,
    (buf.validate.field) = {
      required: true
      string: {prefix: "tnt_"}
    }
  ];
}
