syntax = "proto3";

package sentinez.apps.tenant.v1;

import "buf/validate/validate.proto";
import "sentinez/dmz/edge/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/tenant/v1;tenantpb";

message ResourceSetting {
  sentinez.dmz.edge.v1.Server server = 1;
}

message Resource {
  option (sentinez.types.v1.x_message).database_model = true;

  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];
  
  string id = 2 [(buf.validate.field) = {
    required: true
    string: { prefix: "rsrc_" }
  }];

  string tenant_id = 3 [(buf.validate.field) = {
    required: true
    string: { prefix: "tnt_" }
  }];

  ResourceSetting resource_setting = 4;

  string resource_domain = 5 [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  
  string resource_name = 6 [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  
  sentinez.types.v1.Status status = 7;
}

message Tenant {
  option (sentinez.types.v1.x_message).database_model = true;

  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];
  
  string id = 2 [(buf.validate.field) = {
    required: true
    string: { prefix: "tnt_" }
  }];

  string name = 3;
  string description = 4;

  sentinez.types.v1.Plan plan = 5;
}

message Member {
  option (sentinez.types.v1.x_message).database_model = true;
  sentinez.types.v1.Metadata metadata = 1;
  
  string id = 2 [(buf.validate.field) = {
    required: true
    string: { prefix: "mem_" }
  }];

  string user_id = 3 [(buf.validate.field) = {
    required: true
    string: { prefix: "user_" }
  }];

  string tenant_id = 4 [(buf.validate.field) = {
    required: true
    string: { prefix: "tnt_" }
  }];
  
  repeated sentinez.types.v1.Role roles = 5 [(buf.validate.field).repeated.unique = true];
}