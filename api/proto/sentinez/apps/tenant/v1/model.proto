syntax = "proto3";

package sentinez.apps.tenant.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sentinez/dmz/edge/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/tenant/v1;tenantpb";

// Resource is a server of a tenant: its name, domain and routes are those
// of server (server.name, server.resource_domain), its id is the
// server.resource_id the edge fills into the events of its requests.
message Resource {
  option (sentinez.types.v1.x_message) = {
    database_model: true
    scanner: true
  };

  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];

  string id = 2 [(buf.validate.field) = {
    required: true
    string: {prefix: "rsrc_"}
  }];

  string tenant_id = 3 [
    (buf.validate.field) = {
      required: true
      string: {prefix: "tnt_"}
    },
    (sentinez.types.v1.x_field).nullable = true
  ];

  sentinez.dmz.edge.v1.Server server = 4 [(sentinez.types.v1.x_field).codec = COLUMN_CODEC_PROTO];

  sentinez.types.v1.Status status = 5;
}

message Tenant {
  option (sentinez.types.v1.x_message) = {
    database_model: true
    scanner: true
  };

  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];

  string id = 2 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];

  string name = 3 [(sentinez.types.v1.x_field).nullable = true];
  string description = 4 [(sentinez.types.v1.x_field).nullable = true];

  sentinez.types.v1.Plan plan = 5;
}

message Member {
  option (sentinez.types.v1.x_message) = {
    database_model: true
    scanner: true
  };
  sentinez.types.v1.Metadata metadata = 1 [(sentinez.types.v1.x_field).flatten = true];

  string id = 2 [(buf.validate.field) = {
    required: true
    string: {prefix: "mem_"}
  }];

  string user_id = 3 [(buf.validate.field) = {
    required: true
    string: {prefix: "user_"}
  }];

  string tenant_id = 4 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];

  repeated sentinez.types.v1.Role roles = 5 [(buf.validate.field).repeated.unique = true];
}

// CaCertificate is one certificate of a resource: a trusted CA, or the TLS
// certificate the edge serves (usage SERVER), with its private key when one
// was given. A bundle without a key is split into one record per
// certificate on import, so the parsed fields below describe exactly one
// certificate and the fingerprint is kept unique per resource. A record is
// immutable: it is only created, read and deleted.
message CaCertificate {
  option (sentinez.types.v1.x_message) = {
    database_model: true
    scanner: true
  };

  sentinez.types.v1.Owner owner = 1 [(sentinez.types.v1.x_field).flatten = true];

  string id = 2 [(buf.validate.field) = {
    required: true
    string: {prefix: "cacrt_"}
  }];

  string name = 3 [(buf.validate.field).string.max_len = 128];
  string description = 4;

  // What the edge trusts this CA for.
  CaCertificateUsage usage = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Always STATUS_ACTIVE, set on create.
  sentinez.types.v1.Status status = 6;

  // PEM-encoded certificate: exactly one CERTIFICATE block, with
  // BasicConstraints CA=true unless the usage is SERVER. The source of truth; every parsed field
  // below is set from it by the service, never by the client. Stored
  // encrypted.
  string pem = 7 [(buf.validate.field) = {
    required: true
    string: {
      contains: "-----BEGIN CERTIFICATE-----"
      max_bytes: 65536
    }
  }];

  // Subject and issuer distinguished names, in RFC 2253 form.
  string subject = 8;
  string issuer = 9;

  // Serial number, as lowercase hex.
  string serial_number = 10;

  // SHA-256 of the DER bytes, as lowercase hex.
  string fingerprint_sha256 = 11;

  google.protobuf.Timestamp not_before = 12;
  google.protobuf.Timestamp not_after = 13;

  // Whether subject and issuer are the same (a root CA).
  bool self_signed = 14;

  // Vendor of the CA: the first organization of the issuer, else its
  // common name.
  string provider = 15;

  // PEM-encoded private key of the certificate, empty without one. Stored
  // encrypted and never returned by the API.
  string private_key = 16;

  // Whether the record holds a private key; set on read, not stored.
  bool has_private_key = 17 [(sentinez.types.v1.x_field).ignore = true];
}

enum CaCertificateUsage {
  CA_CERTIFICATE_USAGE_UNSPECIFIED = 0;
  // Verify the certificates of upstream (origin) servers.
  CA_CERTIFICATE_USAGE_UPSTREAM = 1;
  // Verify the client certificates of downstream connections (mTLS).
  CA_CERTIFICATE_USAGE_CLIENT = 2;
  // The TLS certificate the edge serves to its clients: not a CA, and always
  // with its private key.
  CA_CERTIFICATE_USAGE_SERVER = 3;
}
