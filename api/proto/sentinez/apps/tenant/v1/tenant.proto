syntax = "proto3";

package sentinez.apps.tenant.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/apps/tenant/v1/model.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/tenant/v1;tenantpb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: { title: "Tenant Service" version: "1.0" }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: { type: TYPE_API_KEY in: IN_HEADER name: "Authorization" }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // TENANT"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.tenant.v1"
};

// TenantService handles tenant resource management.
service TenantService {
  // Returns service health check status.
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      get: "/tenant/status"
    };
    option (sentinez.types.v1.x_method) = {
      ignore: true
    };
  }

  // Lists tenant resources.
  rpc ListResource(ListResourceRequest) returns (ListResourceResponse) {
    option (google.api.http) = {
      get: "/tenant/resources"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Creates a new tenant resource.
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/tenant/resource"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Updates an existing tenant resource.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      put: "/tenant/resource"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Deletes a tenant resource.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {
      delete: "/tenant/resource"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = {
      get: "/tenant/resource"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  rpc GetResourceByDomain(GetResourceByDomainRequest)
      returns (GetResourceByDomainResponse) {
    option (google.api.http) = {
      get: "/tenant/resource/{resource_domain}"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Lists tenant members.
  rpc ListMember(ListMemberRequest) returns (ListMemberResponse) {
    option (google.api.http) = {
      get: "/tenant/members"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Adds a user to a tenant.
  rpc CreateMember(CreateMemberRequest) returns (CreateMemberResponse) {
    option (google.api.http) = {
      post: "/tenant/member"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Updates the roles of a tenant member.
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse) {
    option (google.api.http) = {
      put: "/tenant/member"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Removes a member from its tenant.
  rpc DeleteMember(DeleteMemberRequest) returns (DeleteMemberResponse) {
    option (google.api.http) = {
      delete: "/tenant/member"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Returns a tenant member.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (google.api.http) = {
      get: "/tenant/member"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Lists tenants.
  rpc ListTenant(ListTenantRequest) returns (ListTenantResponse) {
    option (google.api.http) = {
      get: "/tenant/tenants"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Creates a new tenant.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/tenant/tenant"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Updates the plan of a tenant.
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/tenant/tenant"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Deletes a tenant.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option (google.api.http) = {
      delete: "/tenant/tenant"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }

  // Returns a tenant.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {
      get: "/tenant/tenant"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [ CONTROL_PLANE_PORTAL, CONTROL_PLANE_ADMIN ]
    };
  }
}

message GetResourceRequest {
  string id = 1 [(buf.validate.field) = {
    required: false
    string: { prefix: "senz.tenant.resources." }
  }];
  bool default = 2;
}

message GetResourceByDomainRequest {
  string resource_domain = 1
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
}

message GetResourceByDomainResponse {
  Resource resource = 1;
}

message GetResourceResponse {
  Resource resource = 1;
}

message DeleteResourceRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.resources." }
  }];
}

message DeleteResourceResponse {}

message UpdateResourceRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.resources." }
  }];
  string resource_domain = 2
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string resource_name = 3
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  sentinez.types.v1.Status status = 4;
  sentinez.apps.tenant.v1.ResourceSetting resource_setting = 5;
}

message UpdateResourceResponse {}

message CreateResourceRequest {
  sentinez.apps.tenant.v1.ResourceSetting resource_setting = 1;
  string resource_domain = 2
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string resource_name = 3
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  sentinez.types.v1.Status status = 4;
}

message CreateResourceResponse {
  Resource resource = 1;
}

message ListResourceRequest {
  sentinez.types.v1.Pages page = 1;
  sentinez.types.v1.Status status = 2;
  string resource_name = 4
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string resource_domain = 5
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
}

message ListResourceResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Resource resources = 2;
}

message StatusResponse {
  string message = 1;
}

message StatusRequest {}

message GetMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.members." }
  }];
}

message GetMemberResponse {
  Member member = 1;
}

message DeleteMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.members." }
  }];
}

message DeleteMemberResponse {}

message UpdateMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.members." }
  }];
  // roles replaces the whole role set of the member.
  repeated sentinez.types.v1.Role roles = 2 [(buf.validate.field) = {
    repeated: {
      unique: true
      min_items: 1
      items: { enum: { defined_only: true not_in: [ 0 ] } }
    }
  }];
}

message UpdateMemberResponse {}

message CreateMemberRequest {
  string user_id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.iam.users." }
  }];
  string tenant_id = 2 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenants." }
  }];
  repeated sentinez.types.v1.Role roles = 3 [(buf.validate.field) = {
    repeated: {
      unique: true
      min_items: 1
      items: { enum: { defined_only: true not_in: [ 0 ] } }
    }
  }];
}

message CreateMemberResponse {
  Member member = 1;
}

message ListMemberRequest {
  sentinez.types.v1.Pages page = 1;
  string tenant_id = 2
      [(buf.validate.field).string.prefix = "senz.tenants."];
  string user_id = 3
      [(buf.validate.field).string.prefix = "senz.iam.users."];
}

message ListMemberResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Member members = 2;
}

message GetTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenants." }
  }];
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message DeleteTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenants." }
  }];
}

message DeleteTenantResponse {}

message UpdateTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenants." }
  }];
  sentinez.types.v1.Plan plan = 2 [(buf.validate.field) = {
    required: true
    enum: { defined_only: true }
  }];
}

message UpdateTenantResponse {}

message CreateTenantRequest {
  sentinez.types.v1.Plan plan = 1 [(buf.validate.field) = {
    required: true
    enum: { defined_only: true }
  }];
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message ListTenantRequest {
  sentinez.types.v1.Pages page = 1;
  sentinez.types.v1.Plan plan = 2
      [(buf.validate.field).enum.defined_only = true];
}

message ListTenantResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Tenant tenants = 2;
}
