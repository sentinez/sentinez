syntax = "proto3";

package sentinez.apps.tenant.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/apps/tenant/v1/model.proto";
import "sentinez/dmz/edge/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/tenant/v1;tenantpb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Tenant Service"
    version: "1.0"
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // TENANT"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.tenant.v1"
};

// TenantService handles tenant resource management.
service TenantService {
  // Returns service health check status.
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {get: "/tenant/status"};
    option (sentinez.types.v1.x_method) = {public: true};
  }

  // Lists tenant resources.
  rpc ListResource(ListResourceRequest) returns (ListResourceResponse) {
    option (google.api.http) = {get: "/tenant/resources"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Creates a new tenant resource.
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/tenant/resource"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Updates an existing tenant resource.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      put: "/tenant/resource"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Deletes a tenant resource.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {delete: "/tenant/resource"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = {get: "/tenant/resource"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  rpc GetResourceByDomain(GetResourceByDomainRequest) returns (GetResourceByDomainResponse) {
    option (google.api.http) = {get: "/tenant/resource/{resource_domain}"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Lists tenant members.
  rpc ListMember(ListMemberRequest) returns (ListMemberResponse) {
    option (google.api.http) = {get: "/tenant/members"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Adds a user to a tenant.
  rpc CreateMember(CreateMemberRequest) returns (CreateMemberResponse) {
    option (google.api.http) = {
      post: "/tenant/member"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Updates the roles of a tenant member.
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse) {
    option (google.api.http) = {
      put: "/tenant/member"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Removes a member from its tenant.
  rpc DeleteMember(DeleteMemberRequest) returns (DeleteMemberResponse) {
    option (google.api.http) = {delete: "/tenant/member"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Returns a tenant member.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (google.api.http) = {get: "/tenant/member"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Lists the CA certificates of resources, without their private keys.
  rpc ListCaCertificate(ListCaCertificateRequest) returns (ListCaCertificateResponse) {
    option (google.api.http) = {get: "/tenant/cacertificates"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Creates the CA certificates of a PEM bundle, one per certificate. A
  // certificate is immutable: there is no update, delete and create again.
  rpc CreateCaCertificate(CreateCaCertificateRequest) returns (CreateCaCertificateResponse) {
    option (google.api.http) = {
      post: "/tenant/cacertificate"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Returns a CA certificate, without its private key.
  rpc GetCaCertificate(GetCaCertificateRequest) returns (GetCaCertificateResponse) {
    option (google.api.http) = {get: "/tenant/cacertificate"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Deletes a CA certificate.
  rpc DeleteCaCertificate(DeleteCaCertificateRequest) returns (DeleteCaCertificateResponse) {
    option (google.api.http) = {delete: "/tenant/cacertificate"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Lists tenants.
  rpc ListTenant(ListTenantRequest) returns (ListTenantResponse) {
    option (google.api.http) = {get: "/tenant/tenants"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Creates a new tenant.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/tenant/tenant"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Updates the plan of a tenant.
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/tenant/tenant"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Deletes a tenant.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option (google.api.http) = {delete: "/tenant/tenant"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }

  // Returns a tenant.
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {get: "/tenant/tenant"};

    option (sentinez.types.v1.x_method) = {
      control_planes: [
        CONTROL_PLANE_PORTAL,
        CONTROL_PLANE_ADMIN
      ]
    };
  }
}

message GetResourceRequest {
  string id = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {prefix: "rsrc_"}
  }];
  bool default = 2;
}

message GetResourceByDomainRequest {
  string resource_domain = 1 [(buf.validate.field).string.pattern = "^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63}$"];
}

message GetResourceByDomainResponse {
  Resource resource = 1;
}

message GetResourceResponse {
  Resource resource = 1;
}

message DeleteResourceRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "rsrc_"}
  }];
}

message DeleteResourceResponse {}

message UpdateResourceRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "rsrc_"}
  }];
  // Replaces the stored server when set.
  sentinez.dmz.edge.v1.Server server = 2;
  sentinez.types.v1.Status status = 3;
}

message UpdateResourceResponse {}

message CreateResourceRequest {
  // server.resource_domain is required.
  sentinez.dmz.edge.v1.Server server = 1 [(buf.validate.field).required = true];
  sentinez.types.v1.Status status = 2;

  string tenant_id = 3 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];
}

message CreateResourceResponse {
  Resource resource = 1;
}

message ListResourceRequest {
  sentinez.types.v1.Pages page = 1;
  sentinez.types.v1.Status status = 2;

  // server.name
  string resource_name = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[a-zA-Z0-9-]+"}
  }];

  // server.resource_domain
  string resource_domain = 5 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63}$"}
  }];

  repeated string tenant_ids = 6 [(buf.validate.field) = {
    repeated: {
      unique: true
      items: {
        string: {prefix: "tnt_"}
      }
    }
  }];
}

message ListResourceResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Resource resources = 2;
}

message StatusResponse {
  string message = 1;
}

message StatusRequest {}

message GetMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "mem_"}
  }];
}

message GetMemberResponse {
  sentinez.apps.tenant.v1.Member member = 1;
}

message DeleteMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "mem_"}
  }];
}

message DeleteMemberResponse {}

message UpdateMemberRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "mem_"}
  }];
  // roles replaces the whole role set of the member.
  repeated sentinez.types.v1.Role roles = 2 [(buf.validate.field) = {
    repeated: {
      unique: true
      min_items: 1
      items: {
        enum: {
          defined_only: true
          not_in: [0]
        }
      }
    }
  }];
}

message UpdateMemberResponse {}

message CreateMemberRequest {
  string user_id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "user_"}
  }];
  string tenant_id = 2 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];
  repeated sentinez.types.v1.Role roles = 3 [(buf.validate.field) = {
    repeated: {
      unique: true
      min_items: 1
      items: {
        enum: {
          defined_only: true
          not_in: [0]
        }
      }
    }
  }];
}

message CreateMemberResponse {
  sentinez.apps.tenant.v1.Member member = 1;
}

message ListMemberRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string tenant_ids = 2 [(buf.validate.field) = {
    repeated: {
      unique: true
      items: {
        string: {prefix: "tnt_"}
      }
    }
  }];

  string user_id = 3 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {prefix: "user_"}
  }];
}

message ListMemberResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Member members = 2;
}

message GetTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message DeleteTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];
}

message DeleteTenantResponse {}

message UpdateTenantRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "tnt_"}
  }];
  sentinez.types.v1.Plan plan = 2 [(buf.validate.field) = {
    required: true
    enum: {defined_only: true}
  }];
  // name is left unchanged when empty.
  string name = 3 [(buf.validate.field).string.max_len = 64];
  // description is left unchanged when empty.
  string description = 4 [(buf.validate.field).string.max_len = 255];
}

message UpdateTenantResponse {}

message CreateTenantRequest {
  sentinez.types.v1.Plan plan = 1 [(buf.validate.field) = {
    required: true
    enum: {defined_only: true}
  }];
  string name = 2 [(buf.validate.field) = {
    required: true
    string: {max_len: 64}
  }];
  string description = 3 [(buf.validate.field).string.max_len = 255];
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message ListTenantRequest {
  sentinez.types.v1.Pages page = 1;
  sentinez.types.v1.Plan plan = 2 [(buf.validate.field).enum.defined_only = true];
  // Case-insensitive part of the name.
  string name = 3 [(buf.validate.field).string.max_len = 64];

  repeated string ids = 4 [(buf.validate.field) = {
    repeated: {
      unique: true
      items: {
        string: {prefix: "tnt_"}
      }
    }
  }];
}

message ListTenantResponse {
  int64 total = 1;
  repeated sentinez.apps.tenant.v1.Tenant tenants = 2;
}

message CreateCaCertificateRequest {
  string resource_id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "rsrc_"}
  }];

  // Named after the common name of each certificate when empty; numbered
  // (" #1", " #2" ...) when the bundle holds several.
  string name = 2 [(buf.validate.field).string.max_len = 120];
  string description = 3 [(buf.validate.field).string.max_len = 255];

  CaCertificateUsage usage = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // One or more PEM CERTIFICATE blocks, each a CA; for the usage SERVER they
  // need not be CAs. Each is stored on its own. A PEM private key block may
  // come in it too, as in a single pem file.
  string pem = 5 [(buf.validate.field) = {
    required: true
    string: {
      contains: "-----BEGIN CERTIFICATE-----"
      max_bytes: 262144
    }
  }];

  // PEM private key, kept with the one certificate of pem that it belongs to
  // (the request is refused when it matches none, or holds more than one
  // key). Required for the usage SERVER, here or in pem.
  string private_key = 6 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      contains: "-----BEGIN "
      max_bytes: 65536
    }
  }];
}

message CreateCaCertificateResponse {
  repeated CaCertificate ca_certificates = 1;
}

message GetCaCertificateRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "cacrt_"}
  }];
}

message GetCaCertificateResponse {
  CaCertificate ca_certificate = 1;
}

message DeleteCaCertificateRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {prefix: "cacrt_"}
  }];
}

message DeleteCaCertificateResponse {}

message ListCaCertificateRequest {
  sentinez.types.v1.Pages page = 1;

  repeated string resource_ids = 2 [(buf.validate.field) = {
    repeated: {
      unique: true
      items: {
        string: {prefix: "rsrc_"}
      }
    }
  }];

  CaCertificateUsage usage = 3 [(buf.validate.field).enum.defined_only = true];

  // Lowercase hex SHA-256 of the DER bytes.
  string fingerprint_sha256 = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[0-9a-f]{64}$"}
  }];

  string provider = 5 [(buf.validate.field).string.max_len = 255];
}

message ListCaCertificateResponse {
  int64 total = 1;
  repeated CaCertificate ca_certificates = 2;
}
