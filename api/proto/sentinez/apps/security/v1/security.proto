syntax = "proto3";

package sentinez.apps.security.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/apps/security/v1/model.proto";
import "sentinez/types/rule/v1/rule.proto";
import "sentinez/types/ruleset/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/security/v1;securitypb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Security Service"
    version: "1.0"
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // SECURITY"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.security.v1"
};

// SecurityService handles CRUD operations for WAF rule expressions and rules
service SecurityService {
  // CreateSecRule creates a new WAF rule based
  rpc CreateSecRule(CreateSecRuleRequest) returns (CreateSecRuleResponse) {
    option (google.api.http) = {
      post: "/security/secrule"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // GetSecRule retrieves a WAF rule based by ID
  rpc GetSecRule(GetSecRuleRequest) returns (GetSecRuleResponse) {
    option (google.api.http) = {get: "/security/secrule/{id}"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // UpdateSecRule updates an existing WAF rule based
  rpc UpdateSecRule(UpdateSecRuleRequest) returns (UpdateSecRuleResponse) {
    option (google.api.http) = {
      put: "/security/secrule/{id}"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // DeleteSecRule removes a WAF rule based by ID
  rpc DeleteSecRule(DeleteSecRuleRequest) returns (DeleteSecRuleResponse) {
    option (google.api.http) = {delete: "/security/secrule/{id}"};

    option (sentinez.types.v1.x_method) = {
      audit: true
      audit_no_owner: true
    };
  }

  // ListSecRules lists WAF rule baseds with optional filters
  rpc ListSecRules(ListSecRulesRequest) returns (ListSecRulesResponse) {
    option (google.api.http) = {get: "/security/secrules"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // ── RateLimit ─────────────────────────────────────────────────────────────

  // CreateSecRateLimit creates a new rate limit rule
  rpc CreateSecRateLimit(CreateSecRateLimitRequest) returns (CreateSecRateLimitResponse) {
    option (google.api.http) = {
      post: "/security/secratelimit"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // GetSecRateLimit retrieves a rate limit rule by ID
  rpc GetSecRateLimit(GetSecRateLimitRequest) returns (GetSecRateLimitResponse) {
    option (google.api.http) = {get: "/security/secratelimit/{id}"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // UpdateSecRateLimit updates an existing rate limit rule
  rpc UpdateSecRateLimit(UpdateSecRateLimitRequest) returns (UpdateSecRateLimitResponse) {
    option (google.api.http) = {
      put: "/security/secratelimit/{id}"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // DeleteSecRateLimit removes a rate limit rule by ID
  rpc DeleteSecRateLimit(DeleteSecRateLimitRequest) returns (DeleteSecRateLimitResponse) {
    option (google.api.http) = {delete: "/security/secratelimit/{id}"};

    option (sentinez.types.v1.x_method) = {
      audit: true
      audit_no_owner: true
    };
  }

  // ListSecRateLimits lists rate limit rules with optional filters
  rpc ListSecRateLimits(ListSecRateLimitsRequest) returns (ListSecRateLimitsResponse) {
    option (google.api.http) = {get: "/security/secratelimits"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // ── Ruleset ───────────────────────────────────────────────────────────────

  // CreateSecRuleset creates a new OWASP CRS configuration
  rpc CreateSecRuleset(CreateSecRulesetRequest) returns (CreateSecRulesetResponse) {
    option (google.api.http) = {
      post: "/security/secruleset"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // GetSecRuleset retrieves an OWASP CRS configuration by ID
  rpc GetSecRuleset(GetSecRulesetRequest) returns (GetSecRulesetResponse) {
    option (google.api.http) = {get: "/security/secruleset/{id}"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // UpdateSecRuleset updates an existing OWASP CRS configuration
  rpc UpdateSecRuleset(UpdateSecRulesetRequest) returns (UpdateSecRulesetResponse) {
    option (google.api.http) = {
      put: "/security/secruleset/{id}"
      body: "*"
    };

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // DeleteSecRuleset removes an OWASP CRS configuration by ID
  rpc DeleteSecRuleset(DeleteSecRulesetRequest) returns (DeleteSecRulesetResponse) {
    option (google.api.http) = {delete: "/security/secruleset/{id}"};

    option (sentinez.types.v1.x_method) = {
      audit: true
      audit_no_owner: true
    };
  }

  // ListSecRulesets lists OWASP CRS configurations, filtered by their
  // name or by the fields of their ruleset
  rpc ListSecRulesets(ListSecRulesetsRequest) returns (ListSecRulesetsResponse) {
    option (google.api.http) = {get: "/security/secrulesets"};

    option (sentinez.types.v1.x_method) = {audit: true};
  }

  // ── RuleInfo (OWASP CRS rule catalog) ─────────────────────────────────────

  // GetCRSRuleInfo retrieves a rule of the OWASP CRS catalog by ID
  rpc GetCRSRuleInfo(GetCRSRuleInfoRequest) returns (GetCRSRuleInfoResponse) {
    option (google.api.http) = {get: "/security/crs/rules/{id}"};
  }

  // ListCRSRuleInfos searches the OWASP CRS catalog: the rules a Ruleset
  // can exclude or override, with their tags
  rpc ListCRSRuleInfos(ListCRSRuleInfosRequest) returns (ListCRSRuleInfosResponse) {
    option (google.api.http) = {get: "/security/crs/rules"};
  }

  // ListCRSRuleTags lists the tags carried by the rules of the OWASP CRS
  // catalog: the values a Ruleset can exclude, or ListCRSRuleInfos can
  // filter by
  rpc ListCRSRuleTags(ListCRSRuleTagsRequest) returns (ListCRSRuleTagsResponse) {
    option (google.api.http) = {get: "/security/crs/tags"};
  }

  // ── Condition schema ──────────────────────────────────────────────────────

  // GetConditionSchema returns the conditions a rule expression accepts:
  // the operators and values of each source, the console builds its
  // expression editor from it
  rpc GetConditionSchema(GetConditionSchemaRequest) returns (GetConditionSchemaResponse) {
    option (google.api.http) = {get: "/security/condition-schema"};
  }

  // ── Status ────────────────────────────────────────────────────────────────

  // Status returns the health status of the security service
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {get: "/security/status"};

    option (sentinez.types.v1.x_method) = {public: true};
  }
}

// ── SecRule Messages ─────────────────────────────────────────────────────

message CreateSecRuleRequest {
  SecRule secrule = 1 [(buf.validate.field).required = true];
}

message CreateSecRuleResponse {
  string id = 1;
}

message GetSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSecRuleResponse {
  SecRule secrule = 1;
}

message UpdateSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  SecRule secrule = 2 [(buf.validate.field).required = true];
  // Fields of secrule to update, among name, description, expr, status,
  // priority and action ("*" for all of them); without one, those set in
  // secrule. A named field unset in secrule is cleared.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSecRuleResponse {
  SecRule secrule = 1;
}

message DeleteSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecRuleResponse {}

message ListSecRulesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;

  // metadata.resource_id of the rows, any of them.
  repeated string resource_ids = 11;
}

message ListSecRulesResponse {
  repeated SecRule secrules = 1;
  int64 total = 2;
}

// ── RateLimit Messages ───────────────────────────────────────────────────

message CreateSecRateLimitRequest {
  SecRateLimit secratelimit = 1 [(buf.validate.field).required = true];
}

message CreateSecRateLimitResponse {
  string id = 1;
}

message GetSecRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSecRateLimitResponse {
  SecRateLimit secratelimit = 1;
}

message UpdateSecRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  SecRateLimit secratelimit = 2 [(buf.validate.field).required = true];
  // Fields of rate_limit to update, among name, description, expr,
  // status, priority, action, time_window, max_requests and timeout ("*"
  // for all of them); without one, those set in rate_limit. A named field
  // unset in rate_limit is cleared.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSecRateLimitResponse {
  SecRateLimit secratelimit = 1;
}

message DeleteSecRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecRateLimitResponse {}

message ListSecRateLimitsRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;

  // metadata.resource_id of the rows, any of them.
  repeated string resource_ids = 11;
}

message ListSecRateLimitsResponse {
  repeated SecRateLimit secratelimits = 1;
  int64 total = 2;
}

// ── Ruleset Messages ─────────────────────────────────────────────────────

message CreateSecRulesetRequest {
  SecRuleset secruleset = 1 [(buf.validate.field).required = true];
}

message CreateSecRulesetResponse {
  string id = 1;
}

message GetSecRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSecRulesetResponse {
  SecRuleset secruleset = 1;
}

message UpdateSecRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  SecRuleset secruleset = 2 [(buf.validate.field).required = true];
  // Fields of ruleset to update, among name, description and
  // ruleset ("*" for all of them); without one, those set in ruleset.
  // A named field unset in ruleset is cleared.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSecRulesetResponse {
  SecRuleset secruleset = 1;
}

message DeleteSecRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecRulesetResponse {}

// ListSecRulesetsRequest every filter set must match (AND); the values
// of a repeated filter are alternatives (OR) unless stated otherwise.
message ListSecRulesetsRequest {
  sentinez.types.v1.Pages page = 1;

  // Case-insensitive part of the name.
  string name = 2;

  repeated string ids = 10;

  // metadata.resource_id of the rows, any of them.
  repeated string resource_ids = 11;

  // ── Filters on the fields of setting ──

  // setting.crs.mode or setting.managed.mode.
  repeated sentinez.types.ruleset.v1.EngineMode modes = 20;

  // setting.crs.version.
  repeated sentinez.types.ruleset.v1.CRSVersion versions = 21;

  // setting.status.
  repeated sentinez.types.v1.Status statuses = 22;

  // setting.crs.paranoia_level, 0 = any.
  uint32 paranoia_level = 23 [(buf.validate.field).uint32 = {lte: 4}];

  // Rule groups all listed in setting.crs.categories.
  repeated sentinez.types.ruleset.v1.Category categories = 24;

  // Tags excluded by setting.crs.exclusions.
  repeated string exclusion_tags = 25;

  // Rules with a variable excluded by setting.crs.exclusions.
  repeated uint32 exclusion_rule_ids = 26;

  // Rules with a state changed by setting.crs.overrides.
  repeated uint32 override_rule_ids = 27;

  // setting.provider; PROVIDER_OWASP also matches an unset provider.
  repeated sentinez.types.ruleset.v1.Provider providers = 28;
}

message ListSecRulesetsResponse {
  repeated SecRuleset secrulesets = 1;
  int64 total = 2;
}

// ── RuleInfo Messages ────────────────────────────────────────────────────

message GetCRSRuleInfoRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {
    gte: 900000
    lte: 999999
  }];

  // CRS version of the catalog, unspecified = latest supported.
  sentinez.types.ruleset.v1.CRSVersion version = 2;
}

message GetCRSRuleInfoResponse {
  sentinez.types.ruleset.v1.RuleInfo rule = 1;
}

// ListCRSRuleInfosRequest every filter set must match (AND); the values of
// a repeated filter are alternatives (OR) unless stated otherwise.
message ListCRSRuleInfosRequest {
  sentinez.types.v1.Pages page = 1;

  // CRS version of the catalog, unspecified = latest supported.
  sentinez.types.ruleset.v1.CRSVersion version = 2;

  // Case-insensitive part of the message or of a tag, or the leading
  // digits of the ID (ex: "9421").
  string search = 3;

  repeated uint32 ids = 10;
  repeated sentinez.types.ruleset.v1.Category categories = 11;
  repeated uint32 paranoia_levels = 12;

  // CRITICAL, ERROR, WARNING, NOTICE; case-insensitive.
  repeated string severities = 13;

  // Tags the rule all carries, ex: "attack-sqli".
  repeated string tags = 14;

  // System rules (init, evaluation, flow control) cannot be overridden,
  // they are left out unless asked for.
  bool include_system = 15;
}

message ListCRSRuleInfosResponse {
  repeated sentinez.types.ruleset.v1.RuleInfo rules = 1;

  // Number of rules matching the filters, whatever the page.
  int64 total = 2;
}

// RuleTag tag of the OWASP CRS catalog, ex: "attack-sqli".
message RuleTag {
  string name = 1;

  // Number of rules carrying the tag, among the ones the request covers.
  uint32 rule_count = 2;
}

message ListCRSRuleTagsRequest {
  sentinez.types.v1.Pages page = 1;

  // CRS version of the catalog, unspecified = latest supported.
  sentinez.types.ruleset.v1.CRSVersion version = 2;

  // Case-insensitive part of the tag, ex: "attack".
  string search = 3;

  // Tags only carried by system rules (init, evaluation, flow control)
  // are left out unless asked for, as ListCRSRuleInfos does.
  bool include_system = 15;
}

message ListCRSRuleTagsResponse {
  // Sorted by name.
  repeated RuleTag tags = 1;

  // Number of tags matching the filters, whatever the page.
  int64 total = 2;
}

// ── Status Messages ─────────────────────────────────────────────────────────

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}

// ── Condition schema Messages ────────────────────────────────────────────

message GetConditionSchemaRequest {}

message GetConditionSchemaResponse {
  sentinez.types.rule.v1.ConditionSchema schema = 1;
}
