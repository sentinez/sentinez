syntax = "proto3";

package sentinez.apps.security.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/apps/security/v1/model.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/security/v1;securitypb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: { title: "Security Service" version: "1.0" }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: { type: TYPE_API_KEY in: IN_HEADER name: "Authorization" }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // SECURITY"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.security.v1"
};

// SecurityService handles CRUD operations for WAF rule expressions and rules
service SecurityService {

  // CreateSecRule creates a new WAF rule based
  rpc CreateSecRule(CreateSecRuleRequest)
      returns (CreateSecRuleResponse) {
    option (google.api.http) = {
      post: "/security/secrule"
      body: "*"
    };
  }

  // GetSecRule retrieves a WAF rule based by ID
  rpc GetSecRule(GetSecRuleRequest) returns (GetSecRuleResponse) {
    option (google.api.http) = {
      get: "/security/secrule/{id}"
    };
  }

  // UpdateSecRule updates an existing WAF rule based
  rpc UpdateSecRule(UpdateSecRuleRequest)
      returns (UpdateSecRuleResponse) {
    option (google.api.http) = {
      put: "/security/secrule/{id}"
      body: "*"
    };
  }

  // DeleteSecRule removes a WAF rule based by ID
  rpc DeleteSecRule(DeleteSecRuleRequest)
      returns (DeleteSecRuleResponse) {
    option (google.api.http) = {
      delete: "/security/secrule/{id}"
    };
  }

  // ListSecRules lists WAF rule baseds with optional filters
  rpc ListSecRules(ListSecRulesRequest) returns (ListSecRulesResponse) {
    option (google.api.http) = {
      get: "/security/secrules"
    };
  }

  // ── Status ────────────────────────────────────────────────────────────────

  // Status returns the health status of the security service
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      get: "/security/status"
    };

    option (sentinez.types.v1.x_method) = {
      ignore: true
    };
  }
}

// ── SecRule Messages ─────────────────────────────────────────────────────

message CreateSecRuleRequest {
  SecRule sec_rule = 1 [(buf.validate.field).required = true];
}

message CreateSecRuleResponse {
  string id = 1;
}

message GetSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSecRuleResponse {
  SecRule sec_rule = 1;
}

message UpdateSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  SecRule sec_rule = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSecRuleResponse {
  SecRule sec_rule = 1;
}

message DeleteSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecRuleResponse {}

message ListSecRulesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
}

message ListSecRulesResponse {
  repeated SecRule sec_rules = 1;
  int64 total = 2;
}
// ── Status Messages ─────────────────────────────────────────────────────────

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}
