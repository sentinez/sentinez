syntax = "proto3";

package sentinez.apps.security.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/apps/security/v1/model.proto";
import "sentinez/types/coreruleset/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/security/v1;securitypb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: { title: "Security Service" version: "1.0" }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: { type: TYPE_API_KEY in: IN_HEADER name: "Authorization" }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // SECURITY"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.security.v1"
};

// SecurityService handles CRUD operations for WAF rule expressions and rules
service SecurityService {

  // CreateSecRule creates a new WAF rule based
  rpc CreateSecRule(CreateSecRuleRequest)
      returns (CreateSecRuleResponse) {
    option (google.api.http) = {
      post: "/security/secrule"
      body: "*"
    };
  }

  // GetSecRule retrieves a WAF rule based by ID
  rpc GetSecRule(GetSecRuleRequest) returns (GetSecRuleResponse) {
    option (google.api.http) = {
      get: "/security/secrule/{id}"
    };
  }

  // UpdateSecRule updates an existing WAF rule based
  rpc UpdateSecRule(UpdateSecRuleRequest)
      returns (UpdateSecRuleResponse) {
    option (google.api.http) = {
      put: "/security/secrule/{id}"
      body: "*"
    };
  }

  // DeleteSecRule removes a WAF rule based by ID
  rpc DeleteSecRule(DeleteSecRuleRequest)
      returns (DeleteSecRuleResponse) {
    option (google.api.http) = {
      delete: "/security/secrule/{id}"
    };
  }

  // ListSecRules lists WAF rule baseds with optional filters
  rpc ListSecRules(ListSecRulesRequest) returns (ListSecRulesResponse) {
    option (google.api.http) = {
      get: "/security/secrules"
    };
  }

  // ── RateLimit ─────────────────────────────────────────────────────────────

  // CreateRateLimit creates a new rate limit rule
  rpc CreateRateLimit(CreateRateLimitRequest)
      returns (CreateRateLimitResponse) {
    option (google.api.http) = {
      post: "/security/ratelimit"
      body: "*"
    };
  }

  // GetRateLimit retrieves a rate limit rule by ID
  rpc GetRateLimit(GetRateLimitRequest) returns (GetRateLimitResponse) {
    option (google.api.http) = {
      get: "/security/ratelimit/{id}"
    };
  }

  // UpdateRateLimit updates an existing rate limit rule
  rpc UpdateRateLimit(UpdateRateLimitRequest)
      returns (UpdateRateLimitResponse) {
    option (google.api.http) = {
      put: "/security/ratelimit/{id}"
      body: "*"
    };
  }

  // DeleteRateLimit removes a rate limit rule by ID
  rpc DeleteRateLimit(DeleteRateLimitRequest)
      returns (DeleteRateLimitResponse) {
    option (google.api.http) = {
      delete: "/security/ratelimit/{id}"
    };
  }

  // ListRateLimits lists rate limit rules with optional filters
  rpc ListRateLimits(ListRateLimitsRequest)
      returns (ListRateLimitsResponse) {
    option (google.api.http) = {
      get: "/security/ratelimits"
    };
  }

  // ── CoreRuleset ───────────────────────────────────────────────────────────

  // CreateCoreRuleset creates a new OWASP CRS configuration
  rpc CreateCoreRuleset(CreateCoreRulesetRequest)
      returns (CreateCoreRulesetResponse) {
    option (google.api.http) = {
      post: "/security/coreruleset"
      body: "*"
    };
  }

  // GetCoreRuleset retrieves an OWASP CRS configuration by ID
  rpc GetCoreRuleset(GetCoreRulesetRequest)
      returns (GetCoreRulesetResponse) {
    option (google.api.http) = {
      get: "/security/coreruleset/{id}"
    };
  }

  // UpdateCoreRuleset updates an existing OWASP CRS configuration
  rpc UpdateCoreRuleset(UpdateCoreRulesetRequest)
      returns (UpdateCoreRulesetResponse) {
    option (google.api.http) = {
      put: "/security/coreruleset/{id}"
      body: "*"
    };
  }

  // DeleteCoreRuleset removes an OWASP CRS configuration by ID
  rpc DeleteCoreRuleset(DeleteCoreRulesetRequest)
      returns (DeleteCoreRulesetResponse) {
    option (google.api.http) = {
      delete: "/security/coreruleset/{id}"
    };
  }

  // ListCoreRulesets lists OWASP CRS configurations, filtered by their
  // name or by the fields of their content
  rpc ListCoreRulesets(ListCoreRulesetsRequest)
      returns (ListCoreRulesetsResponse) {
    option (google.api.http) = {
      get: "/security/corerulesets"
    };
  }

  // ── RuleInfo (OWASP CRS rule catalog) ─────────────────────────────────────

  // GetRuleInfo retrieves a rule of the OWASP CRS catalog by ID
  rpc GetRuleInfo(GetRuleInfoRequest) returns (GetRuleInfoResponse) {
    option (google.api.http) = {
      get: "/security/crs/rules/{id}"
    };
  }

  // ListRuleInfos searches the OWASP CRS catalog: the rules a CoreRuleset
  // can exclude or override, with their tags
  rpc ListRuleInfos(ListRuleInfosRequest) returns (ListRuleInfosResponse) {
    option (google.api.http) = {
      get: "/security/crs/rules"
    };
  }

  // ── Status ────────────────────────────────────────────────────────────────

  // Status returns the health status of the security service
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      get: "/security/status"
    };

    option (sentinez.types.v1.x_method) = {
      ignore: true
    };
  }
}

// ── SecRule Messages ─────────────────────────────────────────────────────

message CreateSecRuleRequest {
  SecRule sec_rule = 1 [(buf.validate.field).required = true];
}

message CreateSecRuleResponse {
  string id = 1;
}

message GetSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetSecRuleResponse {
  SecRule sec_rule = 1;
}

message UpdateSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  SecRule sec_rule = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSecRuleResponse {
  SecRule sec_rule = 1;
}

message DeleteSecRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSecRuleResponse {}

message ListSecRulesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
}

message ListSecRulesResponse {
  repeated SecRule sec_rules = 1;
  int64 total = 2;
}

// ── RateLimit Messages ───────────────────────────────────────────────────

message CreateRateLimitRequest {
  RateLimit rate_limit = 1 [(buf.validate.field).required = true];
}

message CreateRateLimitResponse {
  string id = 1;
}

message GetRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRateLimitResponse {
  RateLimit rate_limit = 1;
}

message UpdateRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  RateLimit rate_limit = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateRateLimitResponse {
  RateLimit rate_limit = 1;
}

message DeleteRateLimitRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteRateLimitResponse {}

message ListRateLimitsRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
}

message ListRateLimitsResponse {
  repeated RateLimit rate_limits = 1;
  int64 total = 2;
}

// ── CoreRuleset Messages ─────────────────────────────────────────────────

message CreateCoreRulesetRequest {
  CoreRuleset core_ruleset = 1 [(buf.validate.field).required = true];
}

message CreateCoreRulesetResponse {
  string id = 1;
}

message GetCoreRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetCoreRulesetResponse {
  CoreRuleset core_ruleset = 1;
}

message UpdateCoreRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  CoreRuleset core_ruleset = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateCoreRulesetResponse {
  CoreRuleset core_ruleset = 1;
}

message DeleteCoreRulesetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteCoreRulesetResponse {}

// ListCoreRulesetsRequest every filter set must match (AND); the values
// of a repeated filter are alternatives (OR) unless stated otherwise.
message ListCoreRulesetsRequest {
  sentinez.types.v1.Pages page = 1;

  // Case-insensitive part of the name.
  string name = 2;

  repeated string ids = 10;

  // ── Filters on the fields of content ──

  repeated sentinez.types.coreruleset.v1.EngineMode modes = 20;
  repeated sentinez.types.coreruleset.v1.Version versions = 21;
  repeated sentinez.types.v1.Status statuses = 22;

  // content.paranoia_level, 0 = any.
  uint32 paranoia_level = 23 [(buf.validate.field).uint32 = { lte: 4 }];

  // Rule groups all listed in content.categories.
  repeated sentinez.types.coreruleset.v1.Category categories = 24;

  // Tags excluded by content.exclusions.
  repeated string exclusion_tags = 25;

  // Rules with a variable excluded by content.exclusions.
  repeated uint32 exclusion_rule_ids = 26;

  // Rules with a state changed by content.overrides.
  repeated uint32 override_rule_ids = 27;
}

message ListCoreRulesetsResponse {
  repeated CoreRuleset core_rulesets = 1;
  int64 total = 2;
}

// ── RuleInfo Messages ────────────────────────────────────────────────────

message GetRuleInfoRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = { gte: 900000, lte: 999999 }];

  // CRS version of the catalog, unspecified = latest supported.
  sentinez.types.coreruleset.v1.Version version = 2;
}

message GetRuleInfoResponse {
  sentinez.types.coreruleset.v1.RuleInfo rule = 1;
}

// ListRuleInfosRequest every filter set must match (AND); the values of
// a repeated filter are alternatives (OR) unless stated otherwise.
message ListRuleInfosRequest {
  sentinez.types.v1.Pages page = 1;

  // CRS version of the catalog, unspecified = latest supported.
  sentinez.types.coreruleset.v1.Version version = 2;

  // Case-insensitive part of the message or of a tag, or the leading
  // digits of the ID (ex: "9421").
  string search = 3;

  repeated uint32 ids = 10;
  repeated sentinez.types.coreruleset.v1.Category categories = 11;
  repeated uint32 paranoia_levels = 12;

  // CRITICAL, ERROR, WARNING, NOTICE; case-insensitive.
  repeated string severities = 13;

  // Tags the rule all carries, ex: "attack-sqli".
  repeated string tags = 14;

  // System rules (init, evaluation, flow control) cannot be overridden,
  // they are left out unless asked for.
  bool include_system = 15;
}

message ListRuleInfosResponse {
  repeated sentinez.types.coreruleset.v1.RuleInfo rules = 1;

  // Number of rules matching the filters, whatever the page.
  int64 total = 2;
}

// ── Status Messages ─────────────────────────────────────────────────────────

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}
