syntax = "proto3";

package sentinez.apps.analytic.v1;

import "google/api/annotations.proto";
import "sentinez/apps/analytic/v1/event.proto";
import "sentinez/apps/analytic/v1/model.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/apps/analytic/v1;analyticpb";
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // ANALYTICS"
  service_zone: ZONE_INTERNAL
  service_key: "sentinez.apps.analytic.v1"
};

// AnalyticService handles data visualization
service AnalyticService {
  // Health check Service
  rpc Status(StatusRequest) returns (StatusResponse) {}

  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse) {
    option (google.api.http) = {get: "/analytic/activities"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  rpc ListHttpIngressEvents(ListHttpIngressEventsRequest) returns (ListHttpIngressEventsResponse) {
    option (google.api.http) = {get: "/analytic/events/http-ingress"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  rpc ListHttpEgressEvents(ListHttpEgressEventsRequest) returns (ListHttpEgressEventsResponse) {
    option (google.api.http) = {get: "/analytic/events/http-egress"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  rpc ListSecRuleEvents(ListSecRuleEventsRequest) returns (ListSecRuleEventsResponse) {
    option (google.api.http) = {get: "/analytic/events/secrule"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  rpc ListRateLimitEvents(ListRateLimitEventsRequest) returns (ListRateLimitEventsResponse) {
    option (google.api.http) = {get: "/analytic/events/ratelimit"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  rpc ListCoreRuleEvents(ListCoreRuleEventsRequest) returns (ListCoreRuleEventsResponse) {
    option (google.api.http) = {get: "/analytic/events/coreruleset"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  // GetEventHistogram counts the events of a kind per time bucket,
  // resource and key.
  rpc GetEventHistogram(GetEventHistogramRequest) returns (GetEventHistogramResponse) {
    option (google.api.http) = {get: "/analytic/events/histogram"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  // GetUniqueVisitorHistogram counts the distinct client ips of the
  // requests received by the edge per time bucket and resource.
  rpc GetUniqueVisitorHistogram(GetUniqueVisitorHistogramRequest) returns (GetUniqueVisitorHistogramResponse) {
    option (google.api.http) = {get: "/analytic/visitors/histogram"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  // GetEventTopValues counts the most frequent values of fields of the
  // events of a kind over a time range, and their share of its events.
  rpc GetEventTopValues(GetEventTopValuesRequest) returns (GetEventTopValuesResponse) {
    option (google.api.http) = {get: "/analytic/events/top-values"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  // ListVisitors counts the requests received by the edge per time
  // bucket, resource and client ip.
  rpc ListVisitors(ListVisitorsRequest) returns (ListVisitorsResponse) {
    option (google.api.http) = {get: "/analytic/visitors"};
    option (sentinez.types.v1.x_method) = {ignore: true};
  }
}

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}

message ListActivitiesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
  repeated string resource_ids = 11;
}

message ListActivitiesResponse {
  repeated sentinez.apps.analytic.v1.Activity activities = 1;
  int64 total = 2;
}
