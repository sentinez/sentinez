message GetEventHistogramRequest {
  EventKind kind = 1;
  sentinez.types.v1.HistogramResolution resolution = 2;
  repeated string resource_ids = 3;
  // The buckets end before to (exclusive), else with the current one,
  // and start at from rounded down to a bucket, else a span of the
  // resolution before: at most 1000 of them, see the response. from and
  // to pick the resolution when unspecified.
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  // Requests of the events, by request id, any of them (see
  // ListHttpIngressEventsRequest.request_ids); all when empty.
  repeated string request_ids = 6;
  // Field filters, all of them, each "field:value" (see
  // GetEventTopValuesRequest.filters). With requests or filters the
  // events are counted from their table, slower than unfiltered.
  repeated string filters = 7;
}

// HistogramPoint the events of a resource and key in the bucket starting
// at time.
message HistogramPoint {
  google.protobuf.Timestamp time = 1;
  string resource_id = 2;
  // The value of the key of the kind, 0 without.
  int32 key = 3;
  int64 total = 4;
}

message GetEventHistogramResponse {
  // Oldest first, then per resource and key: one per bucket, a total of
  // 0 when it has no event; a resource without any has key 0.
  repeated HistogramPoint points = 1;
  // The width of one bucket, that of the resolution asked or picked by
  // from and to.
  sentinez.types.v1.HistogramInterval interval = 2;
  // The first bucket starts at from and the last one ends at to.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The range held more than 1000 buckets: from was moved later so the
  // latest 1000 are returned.
  bool truncated = 5;
}

message GetUniqueVisitorHistogramRequest {
  sentinez.types.v1.HistogramResolution resolution = 1;
  repeated string resource_ids = 2;
  // The buckets end before to (exclusive), else with the current one,
  // and start at from rounded down to a bucket, else a span of the
  // resolution before: at most 1000 of them, see the response. from and
  // to pick the resolution when unspecified.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetUniqueVisitorHistogramResponse {
  // Oldest first, then per resource: one per bucket, the key 0, the total
  // the number of distinct client ips of the bucket, 0 without.
  repeated HistogramPoint points = 1;
  // The width of one bucket, that of the resolution asked or picked by
  // from and to.
  sentinez.types.v1.HistogramInterval interval = 2;
  // The first bucket starts at from and the last one ends at to.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The range held more than 1000 buckets: from was moved later so the
  // latest 1000 are returned.
  bool truncated = 5;
}

message ListVisitorsRequest {
  sentinez.types.v1.HistogramResolution resolution = 1;
  repeated string resource_ids = 2;
  // The buckets end before to (exclusive), else with the current one,
  // and start at from rounded down to a bucket, else a span of the
  // resolution before: at most 1000 of them, see the response. from and
  // to pick the resolution when unspecified.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

// VisitorPoint the requests of a client ip to a resource in the bucket
// starting at time.
message VisitorPoint {
  google.protobuf.Timestamp time = 1;
  string resource_id = 2;
  string client_ip = 3;
  int64 total = 4;
}

message ListVisitorsResponse {
  // Oldest bucket first, then the client ip of the most requests.
  repeated VisitorPoint visitors = 1;
  // The width of one bucket, that of the resolution asked or picked by
  // from and to.
  sentinez.types.v1.HistogramInterval interval = 2;
  // The first bucket starts at from and the last one ends at to.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The range held more than 1000 buckets: from was moved later so the
  // latest 1000 are returned.
  bool truncated = 5;
}

message GetEventTopValuesRequest {
  EventKind kind = 1;
  // Resources of the events, any of them; all when empty.
  repeated string resource_ids = 2;
  // Bound the time of the events, from inclusive, to exclusive: to now
  // when unset, from the hour before to when unset.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The fields to count, in this order, each once, named as in the event
  // message of the kind (e.g. client_ip): all those of the kind when empty.
  //   - http ingress: method, status, host, client_ip, country, protocol,
  //     path, user_agent.
  //   - http egress: upstream, status, method, path, content_type,
  //     protocol.
  //   - sec rule, rate limit: matched_secrule_ids, action (its type, a
  //     rule.v1.ActionType number), request_ip, request_domain,
  //     request_path.
  //   - core rule: matched_rule_ids, severities, behavior, total_score,
  //     request_ip, request_domain, request_path.
  // An event counts once per element of a repeated field it holds.
  repeated string fields = 5;
  // The values per field: 5 when 0, at most 20.
  int32 limit = 6;
  // Field filters, all of them, each "field:value": the events holding
  // the value in the field, compared in the type of the field (a number
  // for status; an element of a repeated one). The field is before the first colon, one of those of fields;
  // the value is the rest, colons and spaces included.
  repeated string filters = 7;
  // Requests of the events, by request id, any of them (see
  // ListHttpIngressEventsRequest.request_ids); all when empty.
  repeated string request_ids = 8;
}

// FieldValue the events holding a value of a field.
message FieldValue {
  string value = 1;
  int64 total = 2;
  // total over the events of the range, from 0 to 1.
  double share = 3;
}

// FieldTopValues the most frequent values of a field, the most first;
// the empty values are left out.
message FieldTopValues {
  string field = 1;
  repeated FieldValue values = 2;
}

message GetEventTopValuesResponse {
  // The events of the range.
  int64 total = 1;
  // One per field of the request, in its order.
  repeated FieldTopValues fields = 2;
}

message GetEgressLatencyRequest {
  // The proxied requests measured. Without from, the last 24 hours up to
  // to, else up to now; at most the retention of the events.
  EventSelection selection = 1;
}

// UpstreamLatency the latency of the requests proxied to an upstream, in
// microseconds.
message UpstreamLatency {
  string upstream = 1;
  int64 total = 2;
  int64 avg_micros = 3;
  int64 p50_micros = 4;
  int64 p95_micros = 5;
  int64 p99_micros = 6;
  int64 max_micros = 7;
}

message GetEgressLatencyResponse {
  // One per upstream, ordered by upstream.
  repeated UpstreamLatency upstreams = 1;
  // The range measured.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}
