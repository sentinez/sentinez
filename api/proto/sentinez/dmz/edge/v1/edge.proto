syntax = "proto3";

package sentinez.dmz.edge.v1;

import "sentinez/secure/rule/v1/engine.proto";
import "sentinez/types/v1/options.proto";
import "sentinez/network/http/v1/http.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/dmz/edge/v1;edgepb";
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // EDGE"
  service_kind: KIND_DEMILITARIZED_ZONE
  service_key: "sentinez.dmz.edge.v1"
};

service EdgeService {
  rpc EvaluateIngress(EvaluateIngressRequest) returns (EvaluateIngressResponse);
}

message EvaluateIngressRequest {
  string ruleset_id = 1;
  sentinez.network.http.v1.Request request_context = 2;
}

message EvaluationResult {
  string rule_id = 1;
  bool matched = 2;
  repeated sentinez.secure.rule.v1.Action actions = 3;
}

message EvaluateIngressResponse {
  repeated EvaluationResult results = 1;
}