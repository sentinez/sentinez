syntax = "proto3";

package sentinez.dmz.edge.v1;

import "buf/validate/validate.proto";
import "sentinez/types/cdn/v1/rule.proto";
import "sentinez/types/ruleset/v1/setting.proto";
import "sentinez/types/secrule/v1/engine.proto";
import "sentinez/types/v1/known.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/dmz/edge/v1;edgepb";

// Setting edge setting per user
message Setting {
  Metadata metadata = 1; // @gotags: yaml:"metadata"
  Ingress ingress = 2; // @gotags: yaml:"ingress"
  Security security = 3; // @gotags: yaml:"security"
  TrafficControl traffic_control = 4; // @gotags: yaml:"traffic_control"
  Personal personal = 5; // @gotags: yaml:"personal"
  Delivery delivery = 6; // @gotags: yaml:"delivery"
  Scripting scripting = 7; // @gotags: yaml:"scripting"
}

// Scripting the Lua scripts of a domain. A ---@stage <phase>/<stage> line
// hooks the global function it precedes before or after a stage of the
// edge chain: cache, sec_rate_limit, waiting_room, static, sec_rule,
// sec_ruleset or router.
message Scripting {
  repeated Script scripts = 1; // @gotags: yaml:"scripts"
}

// Script a Lua source run in the sandbox of the edge.
message Script {
  string id = 1; // @gotags: yaml:"id"
  string name = 2; // @gotags: yaml:"name"
  string source = 3; // @gotags: yaml:"source"
  bool disabled = 4; // @gotags: yaml:"disabled"
}

// Ingress is where a request enters the edge and how it reaches the
// origin: the resource (domain, locations and upstreams) and the
// certificates it is served with.
message Ingress {
  Resource resource = 1; // @gotags: yaml:"resource"

  // Certificates of resource: the ones the edge serves for its domain and
  // the ones it dials the HTTPS upstreams with, from its CA certificates;
  // never read from a file.
  Tls tls = 2; // @gotags: yaml:"-"
}

// Tls the certificates of the domain of a setting.
message Tls {
  // The certificates the edge serves (usage SERVER): the key pairs, and
  // the chain of their issuers.
  repeated Certificate certificates = 1;

  // The CAs the certificates of the HTTPS upstreams are verified with
  // (usage UPSTREAM), in place of the system ones; none: the system ones.
  repeated Certificate upstream_cas = 2;

  // The client certificate the edge presents to the HTTPS upstreams
  // (usage UPSTREAM_CLIENT, mTLS): the key pairs, and the chain of their
  // issuers; none: no client certificate.
  repeated Certificate upstream_certificates = 3;
}

// Certificate one certificate and its private key, if any, both sealed
// with SZ_DATA_KEY and bound to id: the cluster never holds them in
// clear, each edge opens them with its own key.
message Certificate {
  string id = 1;
  string pem = 2;
  string private_key = 3;
}

// Metadata identifies the setting in the logs of the edge.
message Metadata {
  // Id of this setting (proxy.yaml), filled into the events of its
  // requests; "tnt_default" when empty.
  string tenant_id = 1; // @gotags: yaml:"tenantId"

  // Display name of the tenant, the apiserver names the tenant it
  // imports this setting under with it; tenant_id when empty.
  string tenant_name = 3; // @gotags: yaml:"tenantName"

  // Plan of the tenant the apiserver imports this setting under.
  sentinez.types.v1.Plan plan = 4; // @gotags: yaml:"plan"
}

// Resource defines where the request goes and how the edge processes it:
message Resource {
  // Id of the resource, filled into the events of its requests;
  // "rsrc_default" when empty.
  string id = 1; // @gotags: yaml:"id"

  string name = 2 [(buf.validate.field) = {
    string: {pattern: "^[a-zA-Z0-9-]+"}
  }]; // @gotags: yaml:"name"

  repeated Location locations = 3; // @gotags: yaml:"locations"

  // Domain the resource is served at, the namespace of the setting: the
  // edge keys its stores by it and matches the request host against it,
  // the apiserver stores it as the domain of the resource. Required.
  string domain = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63}$"}
  }]; // @gotags: yaml:"domain"

  // How the edge carries the TLS of the domain to its upstreams.
  TlsMode tls_mode = 5 [(buf.validate.field).enum.defined_only = true]; // @gotags: yaml:"tlsMode"
}

// TlsMode how the edge carries the TLS of a domain to its upstreams.
enum TlsMode {
  // Each upstream as its protocol says: HTTP terminates, HTTPS
  // re-encrypts.
  TLS_MODE_UNSPECIFIED = 0;
  // The edge decrypts the TLS, processes the HTTP request, and sends it
  // to the upstreams in clear (HTTP), whatever their protocol.
  TLS_MODE_TERMINATE = 1;
  // The edge forwards the TLS untouched, by the server name (SNI) of the
  // client hello, to port 443 of the upstreams: it holds no certificate
  // of the domain and sees no HTTP, so no rule, limit or cache applies.
  TLS_MODE_PASSTHROUGH = 2;
  // The edge decrypts the TLS, processes the HTTP request, then opens a
  // new TLS connection to the upstreams (HTTPS), whatever their protocol,
  // with the upstream CAs and client certificate of the resource.
  TLS_MODE_REENCRYPT = 3;
}

message Location {
  string location = 1 [(buf.validate.field) = {
    string: {pattern: "^/.*$"}
  }]; // @gotags: yaml:"location"

  string proxy_rewrite = 2 [(buf.validate.field) = {
    string: {pattern: "^/.*$"}
  }]; // @gotags: yaml:"proxyRewrite"

  repeated Upstream proxy_pass = 3; // @gotags: yaml:"proxyPass"
  BalanceStrategy balance_strategy = 4; // @gotags: yaml:"balanceStrategy"
  map<string, string> proxy_set_headers = 5; // @gotags: yaml:"proxySetHeaders"
}

// Security user-specific WAF, rate limiting, or bot protection rules
message Security {
  sentinez.types.ruleset.v1.Setting ruleset = 1; // @gotags: yaml:"ruleset"
  repeated SecRule secrules = 2; // @gotags: yaml:"secrules"
  repeated RateLimit limiters = 3; // @gotags: yaml:"limiters"
}

message SecRule {
  sentinez.types.secrule.v1.SecRule ingress = 1; // @gotags: yaml:"ingress"
}

message RateLimit {
  sentinez.types.secrule.v1.SecRule ingress = 1; // @gotags: yaml:"ingress"

  string time_window = 11 [(buf.validate.field) = {
    string: {pattern: "^-?(?:\\d+(?:\\.\\d+)?(?:ns|us|µs|ms|s|m|h))+$"}
  }]; //@gotags: yaml:"timeWindow"

  int64 max_requests = 12; //@gotags: yaml:"maxRequests"

  string timeout = 13 [(buf.validate.field) = {
    string: {pattern: "^-?(?:\\d+(?:\\.\\d+)?(?:ns|us|µs|ms|s|m|h))+$"}
  }]; //@gotags: yaml:"timeout"
}

// Controller for systems using a virtual waiting room or throttling:
message TrafficControl {}

message Delivery {
  repeated sentinez.types.cdn.v1.CDN cdn = 1; // @gotags: yaml:"cdn"
}

// Personal defines where the request goes and how the edge processes it
message Personal {}

message Upstream {
  string server = 1 [(buf.validate.field) = {
    string: {pattern: "^(((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3})|(([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}))$"}
  }]; // @gotags: yaml:"server"

  ProxyProtocol protocol = 2; // @gotags: yaml:"protocol"
}

enum BalanceStrategy {
  BALANCE_STRATEGY_UNSPECIFIED = 0;
  BALANCE_STRATEGY_ROUND_ROBIN = 1;
}

enum ProxyProtocol {
  PROXY_PROTOCOL_UNSPECIFIED = 0;
  PROXY_PROTOCOL_HTTP = 1;
  PROXY_PROTOCOL_HTTPS = 2;
}
