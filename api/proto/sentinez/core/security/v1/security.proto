syntax = "proto3";

package sentinez.core.security.v1;
option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/security/v1;securitypb";

import "protoc-gen-openapiv2/options/annotations.proto";
// import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "sentinez/types/common/v1/options.proto";
import "sentinez/types/secure/ruleengine/v1/ruleengine.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title  : "Rule Service";
    version: "1.0";
  };
  schemes             : HTTP;
  schemes             : HTTPS;
  consumes            : "application/json";
  security_definitions: {
    security: {
      key  : "ApiKeyAuth";
      value: {
        type: TYPE_API_KEY;
        in  : IN_HEADER;
        name: "Authorization";
      }
    }
  }
  security: {
    security_requirement: {
      key  : "ApiKeyAuth";
      value: {}
    }
  }
};

option (sentinez.types.common.v1.x_meta) = {
  service_name: "SENTINEZ // SECURITY",
  service_kind: KIND_CORE,
  service_key : "sentinez.core.security.v1",
};

service SecurityService {

  rpc CreateRuleBased(CreateRuleBasedRequest) returns (CreateRuleBasedResponse) {
    option (google.api.http) = {
      post: "/rule",
      body: "*"
    };
  }

  rpc Status(StatusRequest) returns (StatusResponse) {}
}

message CreateRuleBasedRequest {
  sentinez.types.secure.ruleengine.v1.Rule rule = 1;
}

message CreateRuleBasedResponse {

}

message StatusRequest {}

message StatusResponse { string msg = 1; }
