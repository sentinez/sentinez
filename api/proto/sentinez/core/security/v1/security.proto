syntax = "proto3";

package sentinez.core.security.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/types/secure/ruleengine/v1/ruleengine.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/security/v1;securitypb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Security Service"
    version: "1.0"
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // SECURITY"
  service_kind: KIND_CORE
  service_key: "sentinez.core.security.v1"
};

// SecurityService handles CRUD operations for WAF rule expressions and rules
service SecurityService {
  // ── RuleGroup ────────────────────────────────────────────────────────────
  
  // CreateRuleGroup creates a new WAF rule group
  rpc CreateRuleGroup(CreateRuleGroupRequest) returns (CreateRuleGroupResponse) {
    option (google.api.http) = {
      post: "/security/rulegroup"
      body: "*"
    };
  }

  // GetRuleGroup retrieves a WAF rule group by ID
  rpc GetRuleGroup(GetRuleGroupRequest) returns (GetRuleGroupResponse) {
    option (google.api.http) = {get: "/security/rulegroup/{id}"};
  }

  // UpdateRuleGroup updates an existing WAF rule group
  rpc UpdateRuleGroup(UpdateRuleGroupRequest) returns (UpdateRuleGroupResponse) {
    option (google.api.http) = {
      put: "/security/rulegroup/{id}"
      body: "*"
    };
  }

  // DeleteRuleGroup removes a WAF rule group by ID
  rpc DeleteRuleGroup(DeleteRuleGroupRequest) returns (DeleteRuleGroupResponse) {
    option (google.api.http) = {delete: "/security/rulegroup/{id}"};
  }

  // ListRuleGroups lists WAF rule groups with optional filters
  rpc ListRuleGroups(ListRuleGroupsRequest) returns (ListRuleGroupsResponse) {
    option (google.api.http) = {get: "/security/rulegroups"};
  }

  // ── Rule ──────────────────────────────────────────────────────────────────

  // CreateRule creates a new security rule
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse) {
    option (google.api.http) = {
      post: "/security/rule"
      body: "*"
    };
  }

  // GetRule retrieves a security rule by ID
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse) {
    option (google.api.http) = {get: "/security/rule/{id}"};
  }

  // UpdateRule updates an existing security rule
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse) {
    option (google.api.http) = {
      put: "/security/rule/{id}"
      body: "*"
    };
  }

  // DeleteRule removes a security rule by ID
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse) {
    option (google.api.http) = {delete: "/security/rule/{id}"};
  }

  // ListRules lists security rules with optional filters
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (google.api.http) = {get: "/security/rules"};
  }

  // ── Status ────────────────────────────────────────────────────────────────

  // Status returns the health status of the security service
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {get: "/security/status"};

    option (sentinez.types.v1.x_method) = {ignore: true};
  }
}

// ── RuleGroup Messages ─────────────────────────────────────────────────────

message CreateRuleGroupRequest {
  sentinez.types.secure.ruleengine.v1.RuleGroup rule_group = 1 [(buf.validate.field).required = true];
}

message CreateRuleGroupResponse {
  string id = 1;
}

message GetRuleGroupRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRuleGroupResponse {
  sentinez.types.secure.ruleengine.v1.RuleGroup rule_group = 1;
}

message UpdateRuleGroupRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  sentinez.types.secure.ruleengine.v1.RuleGroup rule_group = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateRuleGroupResponse {
  sentinez.types.secure.ruleengine.v1.RuleGroup rule_group = 1;
}

message DeleteRuleGroupRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteRuleGroupResponse {}

message ListRuleGroupsRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
}

message ListRuleGroupsResponse {
  repeated sentinez.types.secure.ruleengine.v1.RuleGroup rule_groups = 1;
  int64 total = 2;
}

// ── Rule Messages ───────────────────────────────────────────────────────────

message CreateRuleRequest {
  sentinez.types.secure.ruleengine.v1.Rule rule = 1 [(buf.validate.field).required = true];
}

message CreateRuleResponse {
  string id = 1;
}

message GetRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRuleResponse {
  sentinez.types.secure.ruleengine.v1.Rule rule = 1;
}

message UpdateRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  sentinez.types.secure.ruleengine.v1.Rule rule = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateRuleResponse {
  sentinez.types.secure.ruleengine.v1.Rule rule = 1;
}

message DeleteRuleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteRuleResponse {}

message ListRulesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
}

message ListRulesResponse {
  repeated sentinez.types.secure.ruleengine.v1.Rule rules = 1;
  int64 total = 2;
}

// ── Status Messages ─────────────────────────────────────────────────────────

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}
