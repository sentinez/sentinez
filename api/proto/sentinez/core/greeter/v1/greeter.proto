syntax = "proto3";

package sentinez.core.greeter.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/greeter/v1;greeterpb";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Greeter Service"
    version: "1.0"
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "ApiKeyAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth"
      value: {}
    }
  }
};
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // GREETER"
  service_kind: KIND_CORE
  service_key: "sentinez.core.greeter.v1"
};

// GreeterService is a example service
service GreeterService {
  // Example method
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse) {
    option (google.api.http) = {get: "/greeter/say"};

    option (sentinez.types.v1.x_method) = {ignore: true};
  }

  // Health check api
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {get: "/greeter/status"};

    option (sentinez.types.v1.x_method) = {ignore: true};
  }
}

message SayHelloRequest {
  sentinez.types.v1.Pages page = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

message SayHelloResponse {
  string message = 1;
}

message StatusResponse {
  string message = 1;
}

message StatusRequest {}
