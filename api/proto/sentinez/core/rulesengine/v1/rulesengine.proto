syntax = "proto3";

package sentinez.core.rulesengine.v1;
option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/rulesengine/v1;rulesengine";

import "sentinez/std/common/v1/options.proto";

option (sentinez.std.common.v1.sntz_meta) = {
  service_name: "SENTINEZ // RULESENGINE",
  service_kind: KIND_CORE,
  service_key: "sentinez.core.rulesengine.v1",
};

service RulesEngineService {
  rpc Status(StatusRequest) returns (StatusResponse) {}
}

message StatusRequest {

}

message StatusResponse {
  string msg = 1;
}