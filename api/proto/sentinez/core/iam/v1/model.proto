syntax = "proto3";

package sentinez.core.iam.v1;
import "buf/validate/validate.proto";
import "sentinez/common/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/iam/v1;iam";

message Accounts {
  option (sentinez.common.v1.stnz_msg_opts).object_model = true;

  string id = 1 [(buf.validate.field) = { required: true; string: {
    prefix: "stnz.accounts.",
  }}];

  string user_id = 2 [(buf.validate.field) = { required: true; string: {
    prefix: "stnz.users.",
  }}];

  string username = 10 [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string password = 11 [(buf.validate.field).string.min_len = 8];
  string email = 12 [(buf.validate.field).string.email = true];
}

message AccountLite {
  string id = 1 [(buf.validate.field) = { required: true; string: {
    prefix: "stnz.accounts.",
  }}];

  string user_id = 2 [(buf.validate.field) = { required: true; string: {
    prefix: "stnz.users.",
  }}];

  string username = 10 [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string email = 11 [(buf.validate.field).string.email = true];
}

message Users {
  option (sentinez.common.v1.stnz_msg_opts).object_model = true;
  
  string id = 1 [(buf.validate.field) = { required: true, string: {
    prefix: "stnz.users."
  }}];

  string full_name = 10 [(buf.validate.field).required = true];
  string email = 11 [(buf.validate.field).string.email = true];
  string phone_number = 12 [(buf.validate.field).string.pattern = "^\\+?[1-9]\\d{7,14}$"];
}