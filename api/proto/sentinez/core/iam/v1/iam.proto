syntax = "proto3";

package sentinez.core.iam.v1;

import "sentinez/common/v1/options.proto";

import "protoc-gen-openapiv2/options/annotations.proto";
//import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/iam/v1;iam";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "IAM Service";
    version: "1.0";
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  security_definitions: {
    security: {
      key: "ApiKeyAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
      }
    }
  }
  security: {
    security_requirement: {
      key: "ApiKeyAuth";
      value: {}
    }
  }
};

service IdentityAccessManagementService {
  // private method bellow

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (sentinez.common.v1.options) = {ignore: true};
  }


  // public method bellow

  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      get: "/iam/status"
    };

    option (sentinez.common.v1.options) = {ignore: true};
  }

  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/iam/account",
      body: "*"
    };

    option (sentinez.common.v1.options) = {ignore: true};
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      put: "/iam/login",
      body: "*"
    };

    option (sentinez.common.v1.options) = {ignore: true};
  }
}


message LoginRequest {

}

message LoginResponse {

}

message CreateAccountRequest {

}

message CreateAccountResponse {

}

message CreateUserRequest {

}

message CreateUserResponse {

}

message StatusRequest {

}

message StatusResponse {
 string msg = 1;
}