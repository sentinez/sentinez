syntax = "proto3";

package sentinez.core.analytic.v1;
import "buf/validate/validate.proto";

import "sentinez/types/common/v1/options.proto";
import "sentinez/types/model/v1/metadata.proto";
import "google/protobuf/struct.proto";
import "sentinez/edge/v1/edge.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/analytic/v1;analyticpb";

message Activity {
  option (sentinez.types.common.v1.x_message).database_model = true;

  sentinez.types.model.v1.Metadata metadata = 1;
  string id = 2 [(buf.validate.field) = { required: true, string: {
    prefix: "senz.activity."
  }}];
  string resource_id = 3 [(buf.validate.field) = { required: true, string: {
    prefix: "senz.resources."
  }}];

  repeated uint32 unique_visitor = 7;
}