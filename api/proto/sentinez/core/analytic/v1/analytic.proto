syntax = "proto3";

package sentinez.core.analytic.v1;
option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/core/analytic/v1;analyticpb";

import "sentinez/types/common/v1/options.proto";

option (sentinez.types.common.v1.x_meta) = {
  service_name: "SENTINEZ // ANALYTICS",
  service_kind: KIND_CORE,
  service_key : "sentinez.core.analytic.v1",
};

// AnalyticService handles data visualization
service AnalyticService {
  // Health check Service
  rpc Status(StatusRequest) returns (StatusResponse) {}
}

message StatusRequest {

}

message StatusResponse {
  string msg = 1;
}