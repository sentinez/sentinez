syntax = "proto3";

package sentinez.std.common.v1;
option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/std/common/v1;common";

import "sentinez/std/common/v1/role.proto";
import "sentinez/std/common/v1/permission.proto";
import "sentinez/std/common/v1/service.proto";

import "google/protobuf/descriptor.proto";


extend google.protobuf.MethodOptions {
  SentinezMethodOptions sntz_mth_opts = 50001;
}

extend google.protobuf.MessageOptions {
  SentinezMessageOptions sntz_msg_opts = 51001;
}

extend google.protobuf.FileOptions {
  SentinezMetadata metadata = 52001;
}

message SentinezMetadata {
  string service_name = 1;
  Kind service_kind = 2;
  string service_key = 3;
}

message SentinezMessageOptions {
  bool database_model = 1;
}

message SentinezMethodOptions {
  bool ignore = 1;
  repeated Require require = 2;
}

message Require {
  Role role = 1;
  Permission permission = 2;
}