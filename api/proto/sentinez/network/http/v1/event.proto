syntax = "proto3";

package sentinez.network.http.v1;

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/network/http/v1;httppb";

message Event {
  string id = 1;
  string method = 2;
  string scheme = 3;
  string host = 4;
  string path = 5;
  string queries = 6;
  string headers = 7;

  string protocol = 9;
  string remote_address = 10;
  int32 status = 11;
  string user_agent = 12;
  string ray_id = 13;
  int64 asn = 14;
  string country = 15;
  string content_type = 16;
  int64 timestamp = 17; // milisec
  string fingerprint = 18;
  string client_ip = 19;
}