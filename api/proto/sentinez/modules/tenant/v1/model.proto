syntax = "proto3";

package sentinez.modules.tenant.v1;

import "buf/validate/validate.proto";
import "sentinez/dmz/edge/v1/setting.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/modules/tenant/v1;tenantpb";

message Resource {
  option (sentinez.types.v1.x_message).database_model = true;

  sentinez.types.v1.Metadata metadata = 1;
  string id = 2 [(buf.validate.field) = {
    required: true
    string: { prefix: "senz.tenant.resources." }
  }];
  sentinez.dmz.edge.v1.Setting resource_setting = 3;
  string resource_domain = 4
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  string resource_name = 5
      [(buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9._]{2,29}$"];
  sentinez.types.v1.Status status = 6;
  sentinez.types.v1.Plan plan = 7;
}
