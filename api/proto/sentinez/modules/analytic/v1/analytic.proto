syntax = "proto3";

package sentinez.modules.analytic.v1;

import "google/api/annotations.proto";
import "sentinez/modules/analytic/v1/model.proto";
import "sentinez/types/v1/model.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/modules/analytic/v1;analyticpb";
option (sentinez.types.v1.x_meta) = {
  service_name: "SENTINEZ // ANALYTICS"
  service_kind: KIND_MESH
  service_key: "sentinez.modules.analytic.v1"
};

// AnalyticService handles data visualization
service AnalyticService {
  // Health check Service
  rpc Status(StatusRequest) returns (StatusResponse) {}

  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse) {
    option (google.api.http) = {
      get: "/analytic/activities"
    };
    option (sentinez.types.v1.x_method) = {
      ignore: true
    };
  }
}

message StatusRequest {}

message StatusResponse {
  string msg = 1;
}

message ListActivitiesRequest {
  sentinez.types.v1.Pages page = 1;
  repeated string ids = 10;
  repeated string resource_ids = 11;
}

message ListActivitiesResponse {
  repeated sentinez.modules.analytic.v1.Activity activities = 1;
  int64 total = 2;
}
