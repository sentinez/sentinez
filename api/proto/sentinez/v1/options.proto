syntax = "proto3";

package sentinez.v1;

import "sentinez/v1/role.proto";
import "sentinez/v1/permission.proto";

import "google/protobuf/descriptor.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/v1;sentinez";

extend google.protobuf.MethodOptions {
  SentinezMethodOptions options = 50001;
}

message SentinezMethodOptions {
  bool ignore = 1;
  repeated Require require = 2;
}

message Require {
  Role role = 1;
  Permission permission = 2;
}