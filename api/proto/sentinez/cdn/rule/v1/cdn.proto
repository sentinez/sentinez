syntax = "proto3";

package sentinez.cdn.rule.v1;
option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/cdn/rule/v1;rulepb";

import "sentinez/secure/rule/v1/engine.proto";
import "sentinez/types/v1/known.proto";

import "google/protobuf/timestamp.proto";

message Rule {
  string id = 1;
  string name = 2;
  string description = 3;
  sentinez.secure.rule.v1.Expression expr = 4;

  sentinez.types.v1.Status status = 6;
  int32 priority = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CDN {
  bool enable = 1;  // @gotags: yaml:"enable"
  Rule rule = 2;    // @gotags: yaml:"rule"
}