syntax = "proto3";

package sentinez.types.secrule.v1;

import "google/protobuf/timestamp.proto";
import "sentinez/types/v1/known.proto";
import "sentinez/types/rule/v1/rule.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/secrule/v1;secrulepb";

message SecRule {
  string id = 1;
  string name = 2;
  string description = 3;

  sentinez.types.rule.v1.Expression expr = 4;
  sentinez.types.rule.v1.Action action = 5;
  sentinez.types.v1.Status status = 6;
  int32 priority = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SecRuleLite {
  string id = 1;
  string name = 2;
  string description = 3;

  sentinez.types.rule.v1.ExpressionLite expr = 4;
  sentinez.types.rule.v1.Action action = 5;
  string status = 6;
}
