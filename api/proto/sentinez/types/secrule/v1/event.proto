syntax = "proto3";

package sentinez.types.secrule.v1;

import "sentinez/types/rule/v1/rule.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/secrule/v1;secrulepb";

message RuleEvent {
  option (sentinez.types.v1.x_message).database_model = true;

  string id = 1;
  repeated string matched_secrule_ids = 2;
  repeated string messages = 3;
  string resource_id = 4;
  string tenant_id = 5;
  int64 matched_time = 6; // milisec
  sentinez.types.rule.v1.Action action = 7;
  sentinez.types.rule.v1.RuleService service = 8;

  string request_domain = 10;
  string request_path = 11;
  string request_query = 12;
  string request_ip = 13;
  string request_id = 14;
}
