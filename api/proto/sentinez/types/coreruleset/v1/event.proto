syntax = "proto3";

package sentinez.types.coreruleset.v1;

import "sentinez/types/rule/v1/rule.proto";
import "sentinez/types/v1/options.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/coreruleset/v1;corerulesetpb";

message CoreRuleEvent {
  option (sentinez.types.v1.x_message).database_model = true;

  string id = 1;

  repeated int32 matched_rule_ids = 2;
  repeated string severities = 3;
  repeated string messages = 4;
  int32 total_score = 5;
  int64 matched_time = 6; // milisec
  string resource_id = 7;
  string tenant_id = 8;
  sentinez.types.rule.v1.RuleService service = 9;


  string request_ip = 10;
  string request_domain = 11;
  string request_path = 12;
  string request_query = 13;
  string request_id = 14;
  sentinez.types.rule.v1.RuleBehavior behavior = 15;
}
