syntax = "proto3";

package sentinez.types.rule.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/rule/v1;rulepb";

// The possible sources from which a field can be extracted in a request
enum FieldSource {
  FIELD_SOURCE_UNSPECIFIED = 0;
  FIELD_SOURCE_HEADER = 1;
  FIELD_SOURCE_QUERY = 2;
  FIELD_SOURCE_PATH = 3;
  FIELD_SOURCE_BODY = 4;
  FIELD_SOURCE_IP = 5;
  FIELD_SOURCE_JA4 = 6;
  FIELD_SOURCE_TLS = 7;
  FIELD_SOURCE_METHOD = 8;
  FIELD_SOURCE_HOST = 9;
}

// A logical condition expression
message Condition {
  string id = 5; // @gotags: yaml:"-"
  // The source of the field
  // Example: "User-Agent" or "country"
  FieldSource source = 1; // @gotags: yaml:"source"
  string key = 2; // @gotags: yaml:"key"
  // Supported operators: "eq", "ne", "contains",
  // "matches", "in", "prefix", "suffix", "gt", "lt"
  Operator operator = 3; // @gotags: yaml:"operator"
  // The value to compare against
  google.protobuf.Value value = 4; // @gotags: yaml:"value"
}

enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_EQ = 1;
  OPERATOR_NE = 2;
  OPERATOR_CONTAINS = 3;
  OPERATOR_MATCHES = 4;
  OPERATOR_IN = 5;
  OPERATOR_PREFIX = 6;
  OPERATOR_SUFFIX = 7;
  OPERATOR_GT = 8;
  OPERATOR_GTE = 9;
  OPERATOR_LT = 10;
  OPERATOR_LTE = 11;
  OPERATOR_NOT_IN = 12;
}

// An action to execute when a rule matches
message Action {
  // Example types: "block", "log", "modify_header",
  // "redirect", "set_tag", "route_to"
  ActionType type = 1; // @gotags: yaml:"type"

  // Dynamic parameters, e.g., { "status": 403, "message": "Forbidden" }
  google.protobuf.Struct params = 2; // @gotags: yaml:"params"
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_BLOCK = 1;
  ACTION_TYPE_LOG = 2;
  ACTION_TYPE_MODIFY_HEADER = 3;
  ACTION_TYPE_REDIRECT = 4;
  ACTION_TYPE_SET_TAG = 5;
  ACTION_TYPE_ROUTE_TO = 6;
  ACTION_TYPE_CHALLENGE = 7;
  // The request was over a rate limiter and answered 429 Too Many
  // Requests: the action of the rate limit events, set by the edge; not
  // one a rule is configured with.
  ACTION_TYPE_RATE_LIMIT = 8;
}

// A complete rule definition
message Rule {
  Condition condition = 1; // @gotags: yaml:"condition"
}

// A group matching when its rules, its or group and all its and groups do:
//
//   rules AND (one of or_condition) AND (every one of and_condition)
//
// An empty or_condition matches. and_condition holds the groups of a second
// (or third...) or group, each one carrying its own: (a or b) and (c or d)
// is {or_condition: [a, b], and_condition: [{or_condition: [c, d]}]}.
message AndCondition {
  repeated Rule rules = 1;
  repeated AndCondition or_condition = 2;
  repeated AndCondition and_condition = 3;
}

message Expression {
  repeated AndCondition or_condition = 1;
}

message MatchedRules {
  repeated string ids = 1;
  repeated string names = 2;
}

enum RuleService {
  RULE_SERVICE_UNSPECIFIED = 0;
  RULE_SERVICE_SECRULESET = 1;
  RULE_SERVICE_SECRULE = 2;
  RULE_SERVICE_SECRATELIMIT = 3;
}

enum RuleBehavior {
  RULE_BEHAVIOR_UNSPECIFIED = 0;
  RULE_BEHAVIOR_DENY = 1;
  RULE_BEHAVIOR_ALLOW = 2;
  // Would have been denied, but the engine only detects
  // (ENGINE_MODE_DETECTION_ONLY).
  RULE_BEHAVIOR_LOG = 3;
}

// ── Condition schema ──────────────────────────────────────────────────────
// The conditions the edge can evaluate: the combinations of source, key,
// operator and value it accepts. A condition outside of it is rejected when
// a rule is written, and the console builds its editor from it.

// How a variant of a source uses the key of the condition.
enum KeyMode {
  KEY_MODE_UNSPECIFIED = 0;
  // The key must be empty: the source has a single value (path, IP...).
  KEY_MODE_NONE = 1;
  // The key names the field to read, e.g. the header "User-Agent".
  KEY_MODE_REQUIRED = 2;
}

// The kind of the value of a condition. The value is always a string, or a
// list of strings when the operator spec is a list: the edge reads it as
// such, a JSON number or bool would never match.
enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0;
  // Any non-empty text.
  VALUE_KIND_STRING = 1;
  // A decimal number, e.g. "1024" or "0.5".
  VALUE_KIND_NUMBER = 2;
  // A regular expression in the RE2 syntax.
  VALUE_KIND_REGEX = 3;
  // An IP address or a CIDR prefix, e.g. "10.0.0.1" or "10.0.0.0/8".
  VALUE_KIND_IP = 4;
  // One of the enum_values of the operator spec.
  VALUE_KIND_ENUM = 5;
  // The name of a header or a query parameter.
  VALUE_KIND_NAME = 6;
}

// An operator a variant accepts, with the value it compares to.
message OperatorSpec {
  Operator operator = 1;
  ValueKind value_kind = 2;
  // The value is a non-empty list of value_kind items.
  bool list = 3;
  // The allowed values of VALUE_KIND_ENUM, compared case-sensitively.
  repeated string enum_values = 4;
}

// A way to read a source: the key it takes and the operators it accepts.
message SourceVariant {
  // Stable name of the variant, e.g. "value" or "presence".
  string name = 1;
  KeyMode key_mode = 2;
  repeated OperatorSpec operators = 3;
}

// The variants of a source, picked by the key: a source has at most one
// variant per KeyMode.
message SourceSpec {
  FieldSource source = 1;
  repeated SourceVariant variants = 2;
}

message ConditionSchema {
  repeated SourceSpec sources = 1;
}
