syntax = "proto3";

package sentinez.types.rule.common.v1;

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/rule/common/v1;rulecmn";

message CoreRulesets {
  string        name    = 1;
  repeated Rule rules   = 2;
  string        version = 3;
}

message Rule {
  RuleAction actions       = 1;
  string     configuration = 2;
  string     level         = 3;
}

message RuleAction {
  string          statement = 1;
  RuleAction      children  = 2;
  RuleActionField fields    = 3;
}

message RuleActionField {
  repeated string id       = 1;
  repeated string logdata  = 2;
  repeated string msg      = 3;
  repeated string phase    = 4;
  repeated string setvar   = 5;
  repeated string severity = 6;
  repeated string t        = 7;
  repeated string ver      = 8;
  repeated string tag      = 9;
}

message RuleSettings {

}