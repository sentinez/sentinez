syntax = "proto3";

package sentinez.types.model.v1;

import "sentinez/types/common/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/model/v1;modelpb";

message Metadata {
  option (sentinez.types.common.v1.x_message).database_model = true;

  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DISABLE = 2;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_STANDARD = 2;
  PLAN_PRO = 3;
}