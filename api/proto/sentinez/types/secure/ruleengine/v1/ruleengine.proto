syntax = "proto3";

package sentinez.types.secure.ruleengine.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sentinez/types/v1/known.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/secure/ruleengine/v1;ruleenginepb";

// The possible sources from which a field can be extracted in a request
enum FieldSource {
  FIELD_SOURCE_UNSPECIFIED = 0;
  FIELD_SOURCE_HEADER = 1;
  FIELD_SOURCE_QUERY = 2;
  FIELD_SOURCE_PATH = 3;
  FIELD_SOURCE_BODY = 4;
  FIELD_SOURCE_IP = 5;
  FIELD_SOURCE_JA4 = 6;
  FIELD_SOURCE_TLS = 7;
  FIELD_SOURCE_METHOD = 8;
  FIELD_SOURCE_HOST = 9;
}

// A logical condition expression
message Condition {
  string id = 5; // @gotags: yaml:"-"
  // The source of the field
  // Example: "User-Agent" or "country"
  FieldSource source = 1; // @gotags: yaml:"source"
  string key = 2; // @gotags: yaml:"key"
  // Supported operators: "eq", "ne", "contains",
  // "matches", "in", "prefix", "suffix", "gt", "lt"
  Operator operator = 3; // @gotags: yaml:"operator"
  // The value to compare against
  google.protobuf.Value value = 4; // @gotags: yaml:"value"
}

enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_EQ = 1;
  OPERATOR_NE = 2;
  OPERATOR_CONTAINS = 3;
  OPERATOR_MATCHES = 4;
  OPERATOR_IN = 5;
  OPERATOR_PREFIX = 6;
  OPERATOR_SUFFIX = 7;
  OPERATOR_GT = 8;
  OPERATOR_GTE = 9;
  OPERATOR_LT = 10;
  OPERATOR_LTE = 11;
  OPERATOR_NOT_IN = 12;
}

enum Logic {
  LOGIC_UNSPECIFIED = 0;
  LOGIC_AND = 1;
  LOGIC_OR = 2;
  LOGIC_NOT = 3;
}

// An action to execute when a rule matches
message Action {
  string id = 1;

  // Example types: "block", "log", "modify_header",
  // "redirect", "set_tag", "route_to"
  ActionType type = 2;

  // Dynamic parameters, e.g., { "status": 403, "message": "Forbidden" }
  google.protobuf.Struct params = 3;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_BLOCK = 1;
  ACTION_TYPE_LOG = 2;
  ACTION_TYPE_MODIFY_HEADER = 3;
  ACTION_TYPE_REDIRECT = 4;
  ACTION_TYPE_SET_TAG = 5;
  ACTION_TYPE_ROUTE_TO = 6;
}

// A complete rule definition
message Rule {
  string id = 1;
  string name = 2; // @gotags: yaml:"name"
  string description = 3;
  Condition condition = 4; // @gotags: yaml:"condition"
}

// A complete rule definition
message RuleLite {
  string id = 1;
  string name = 2; // @gotags: yaml:"name"
  ConditionLite condition = 4; // @gotags: yaml:"condition"
  repeated string actions = 5; // @gotags: yaml:"actions"
}

// A logical condition expression
message ConditionLite {
  // The source of the field
  // Example: "User-Agent" or "country"
  string source = 1; // @gotags: yaml:"source"
  string key = 2; // @gotags: yaml:"key"
  // Supported operators: "eq", "ne", "contains",
  // "matches", "in", "prefix", "suffix", "gt", "lt"
  string operator = 3; // @gotags: yaml:"operator"
  // The value to compare against
  string value = 4; // @gotags: yaml:"value"
}

message MatchedRules {
  repeated string ids = 1;
  repeated string names = 2;
}

message RuleBased {
  string id = 1;
  string name = 2;
  string description = 3;

  message Node {
    Logic operator = 1;
    repeated Rule rules = 2;
    repeated Node groups = 3;
  }

  Node node = 4;
  Action action = 5;
  sentinez.types.v1.Status status = 6;
  int32 priority = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RuleBasedLite {
  string id = 1;
  string name = 2;
  string description = 3;

  message NodeLite {
    string operator = 1; // AND, OR, NOT
    repeated RuleLite rules = 2;
    repeated NodeLite groups = 3;
  }

  NodeLite node = 4;
}
