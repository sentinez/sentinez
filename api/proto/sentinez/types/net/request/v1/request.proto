syntax = "proto3";

package sentinez.types.net.request.v1;

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/net/request/v1;requestpb";

message RequestHeader {
  string key   = 1;
  string value = 2;
}

message QueryValues { repeated string values = 1; }

message RequestEvent {
  string                 req_id         = 1;
  string                 method         = 2;
  string                 scheme         = 3;
  string                 host           = 4;
  string                 path           = 5;
  string                 query          = 6;
  repeated RequestHeader headers        = 7;
  string                 protocol       = 9;
  string                 remote_address = 10;

  bytes resp_body = 8;
  int32 status    = 11;

  string user_agent   = 12;
  string ray_id       = 13;
  int64  asn          = 14;
  string country      = 15;
  string content_type = 16;
}
