syntax = "proto3";

package sentinez.types.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/v1;typepb";

message Empty {}

message Context {
  string name = 1;
  google.protobuf.Timestamp expire_at = 2;
  string user_id = 3;
  int32 permission_bitwise = 4;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_GATEWAY_API = 1;
  KIND_GATEWAY_EDGE = 2;
  KIND_GATEWAY_WEBSOCKET = 3;
  KIND_CORE = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_LEADER = 2;
}

enum Permission {
  PERMISSION_UNSPECIFIED = 0;

  PERMISSION_ROOT = 1; // 1 << 0
  PERMISSION_CREATE_OWN = 2; // 1 << 1
  PERMISSION_CREATE_ANY = 4; // 1 << 2
  PERMISSION_VIEW_OWN = 8; // 1 << 3
  PERMISSION_VIEW_ANY = 16; // 1 << 4
  PERMISSION_UPDATE_OWN = 32; // 1 << 5
  PERMISSION_UPDATE_ANY = 64; // 1 << 6
  PERMISSION_DELETE_OWN = 128; // 1 << 7
  PERMISSION_DELETE_ANY = 256; // 1 << 8
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DISABLE = 2;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_STANDARD = 2;
  PLAN_PRO = 3;
}

enum LogKind {
  LOG_KIND_UNSPECIFIED = 0;
  LOG_KIND_HTTP = 1;
  LOG_KIND_WAF = 2;
  LOG_KIND_RULE = 3;
}

enum Errors {
  ERRORS_UNSPECIFIED = 0;
  ERRORS_INTERNAL_ERROR = 1;
  ERRORS_NOT_FOUND = 2;
  ERRORS_UNAUTHORIZED = 3;
  ERRORS_FORBIDDEN = 4;
  ERRORS_INVALID_DATA = 5;
  ERRORS_UNIMPLEMENTED = 6;
}
