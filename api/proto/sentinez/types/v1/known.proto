syntax = "proto3";

package sentinez.types.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/v1;typepb";

message Empty {}

message Context {
  string name = 1;
  google.protobuf.Timestamp expire_at = 2;
  string user_id = 3;
  ControlPlane control_plane = 4;
}

enum Zone {
  ZONE_UNSPECIFIED = 0;
  ZONE_DEMILITARIZED = 1;
  ZONE_INTERNAL = 2;
  ZONE_PRIVATE_API = 3;
  ZONE_PUBLIC_API = 4;
}

enum ControlPlane {
  CONTROL_PLANE_UNSPECIFIED = 0;
  CONTROL_PLANE_PORTAL = 1;
  CONTROL_PLANE_ADMIN = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DISABLE = 2;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_STANDARD = 2;
  PLAN_PRO = 3;
}

enum LogType {
  LOG_TYPE_UNSPECIFIED = 0;
  LOG_TYPE_HTTP = 1;
  LOG_TYPE_WAF = 2;
  LOG_TYPE_SEC_RULE = 3;
  LOG_TYPE_RATE_LIMIT = 4;
  LOG_TYPE_CDN_RULE = 5;
}

enum Errors {
  ERRORS_UNSPECIFIED = 0;
  ERRORS_INTERNAL_ERROR = 1;
  ERRORS_NOT_FOUND = 2;
  ERRORS_UNAUTHORIZED = 3;
  ERRORS_FORBIDDEN = 4;
  ERRORS_INVALID_DATA = 5;
  ERRORS_UNIMPLEMENTED = 6;
}
