syntax = "proto3";

package sentinez.types.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/types/v1;typepb";

message Empty {}

message Context {
  string name = 1;
  google.protobuf.Timestamp expire_at = 2;
  string user_id = 3;
  Console console = 5;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_ACCESS_ZONE = 1;
  KIND_DEMILITARIZED_ZONE = 2;
  KIND_MESH = 4;
}

enum Console {
  CONSOLE_UNSPECIFIED = 0;
  CONSOLE_PORTAL = 1;
  CONSOLE_ADMIN = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DISABLE = 2;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_STANDARD = 2;
  PLAN_PRO = 3;
}

enum LogKind {
  LOG_KIND_UNSPECIFIED = 0;
  LOG_KIND_HTTP = 1;
  LOG_KIND_WAF = 2;
  LOG_KIND_RULE = 3;
}

enum Errors {
  ERRORS_UNSPECIFIED = 0;
  ERRORS_INTERNAL_ERROR = 1;
  ERRORS_NOT_FOUND = 2;
  ERRORS_UNAUTHORIZED = 3;
  ERRORS_FORBIDDEN = 4;
  ERRORS_INVALID_DATA = 5;
  ERRORS_UNIMPLEMENTED = 6;
}
