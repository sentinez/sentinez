syntax = "proto3";

package sentinez.types.v1;

import "google/protobuf/descriptor.proto";
import "sentinez/types/v1/known.proto";

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/v1;typepb";

extend google.protobuf.MethodOptions {
  XMethod x_method = 50001;
}

extend google.protobuf.MessageOptions {
  XMessage x_message = 51001;
}

extend google.protobuf.FileOptions {
  XMeta x_meta = 52001;
}

message XMeta {
  string service_name = 1;
  Kind service_kind = 2;
  string service_key = 3;
}

message XMessage {
  bool database_model = 1;
  bool export_field = 2;
}

message XMethod {
  bool ignore = 1;
  repeated Console consoles = 2;
}
