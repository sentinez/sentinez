syntax = "proto3";

package sentinez.types.notify.v1;

option go_package = "github.com/sentinez/sentinez/api/proto/sentinez/types/notify/v1;notifypb";

// Notification is a message pushed to the console.
message Notification {
  string title = 2;
  NotiType noti_type = 3;
  string message = 4;
}

enum NotiType {
  NOTI_TYPE_UNSPECIFIED = 0;
  NOTI_TYPE_SUCCESS = 1;
  NOTI_TYPE_INFO = 2;
  NOTI_TYPE_WARNING = 3;
  NOTI_TYPE_ERROR = 4;
}