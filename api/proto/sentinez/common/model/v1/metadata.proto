syntax = "proto3";

package sentinez.common.model.v1;

import "sentinez/common/v1/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/common/model/v1;modelpb";

message Metadata {
  option (sentinez.common.v1.stnz_msg_opts).object_model = true;

  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string created_by = 3;
  string updated_by = 4;

  // ref: user_id
  string resource_owner_id = 5;
}