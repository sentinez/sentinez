syntax = "proto3";

package sentinez.common.v1;

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/common/v1;common";

message Config {
    string timescale_uri = 1;
    string postgres_uri = 2;
    string clickhouse_uri = 3;
    string secret_key = 4;
}