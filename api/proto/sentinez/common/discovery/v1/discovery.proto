syntax = "proto3";

package sentinez.common.discovery.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/sentinez/sentinez/api/gen/go/sentinez/common/discovery/v1;discovery";

message HeartbeatRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RegisterRequest {
  string name = 1 [(buf.validate.field).string.pattern = "^sentinez\\."];
  string address = 2 [(buf.validate.field).string.address = true];
  int32 port = 3 [(buf.validate.field).int32.gte = 1000];
  google.protobuf.Duration ttl = 4 [(buf.validate.field).duration.gt = {seconds: 0}];
}

message RegisterResponse {
  string id = 1;
  string name = 2 [(buf.validate.field).string.pattern = "^sentinez\\."];
  string address = 3 [(buf.validate.field).string.address = true];
  int32 port = 4 [(buf.validate.field).int32.gte = 1000];
}

message DiscoverRequest {
  string name = 1 [(buf.validate.field).string.pattern = "^sentinez\\."];
}

message DiscoverResponse {
  string name = 1 [(buf.validate.field).string.pattern = "^sentinez\\."];
  string address = 2 [(buf.validate.field).string.host_and_port = true];
}

// Registrar model
message Registrar {
  string id = 1;
  string name = 2 [(buf.validate.field).string.pattern = "^sentinez\\."];
  string address = 3 [(buf.validate.field).string.host_and_port = true];
  google.protobuf.Duration ttl = 4 [(buf.validate.field).duration.gt = {seconds: 0}];
}

