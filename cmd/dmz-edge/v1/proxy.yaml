# ----------------------------------------------------------
# EDGE SETTINGS PER USER
# ----------------------------------------------------------
# Defines how the edge proxy behaves for each user or tenant.
# Includes routing configuration, security policies,
# traffic control rules, and user personalization.
# ----------------------------------------------------------
setting:
  # ----------------------------------------------------------
  # METADATA — DEBUG & OBSERVABILITY
  # ----------------------------------------------------------
  # Contains configuration metadata for monitoring,
  # versioning, and debugging purposes.
  # ----------------------------------------------------------
  metadata:
    # version: "v1"                    # Configuration version
    # owner: "hunghd"                  # Maintainer or tenant identifier
    # traceId: "abc123"                # Optional trace ID for tracking
    {}

  # ----------------------------------------------------------
  # SERVER — ROUTING CONFIGURATION
  # ----------------------------------------------------------
  # Defines where incoming requests are forwarded to
  # and how URLs are rewritten before reaching the origin server.
  # ----------------------------------------------------------
  server:
    name: badcheese # Logical namespace grouping related routes
    listen:
      - 80
      - 443
    locations:
      - location: / # URL prefix to match incoming requests
        proxyRewrite: / # (Optional) rewrite prefix before forwarding
        proxyPass: # Destination origin upstream(s)
          - server: shark-app-8dkwp.ondigitalocean.app
            protocol: PROXY_PROTOCOL_HTTPS
        balanceStrategy: BALANCE_STRATEGY_ROUND_ROBIN
        proxySetHeaders:
          Host: $host
          X-Real-IP: $remote_addr
          X-Forwarded-For: $proxy_add_x_forwarded_for
          X-Forwarded-Proto: $scheme
          X-Forwarded-Host: $host

      # Example 1:
      - location: /local
        proxyRewrite: /
        proxyPass:
          - server: 127.0.0.1
            protocol: PROXY_PROTOCOL_HTTP

      # Example 2:
      - location: /api
        proxyRewrite: /
        proxyPass:
          - server: shark-app-8dkwp.ondigitalocean.app
            protocol: PROXY_PROTOCOL_HTTPS
        proxySetHeaders:
          X-Original-Path: $request_uri
          X-Forwarded-Prefix: /api

    # --------------------------------------------------------
    # EXAMPLE: NEWS NAMESPACE
    # --------------------------------------------------------
    # name: news
    # listen:
    #   - 80
    # locations:
    #   - location: /
    #     proxyPass:
    #       - server: badcheese.com
    #         protocol: 1
    # --------------------------------------------------------

  # ----------------------------------------------------------
  # SECURITY — WAF, RATE LIMIT, BOT DEFENSE
  # ----------------------------------------------------------
  # Defines Web Application Firewall (WAF) rules,
  # rate limiting thresholds, and bot detection policies
  # for each user or tenant.
  # ----------------------------------------------------------
  security:
    isWafEngineOn: true
    ruleBased:
      name: "Complex Logic: (Path AND Method) OR IP"
      expr:
        orCondition:
          - rules:
            - name: "block path"
              condition:
                source: FIELD_SOURCE_PATH
                key: "/block"
                operator: OPERATOR_EQ
                value: "/block"

            - name: "block method"
              condition:
                source: FIELD_SOURCE_METHOD
                key: "POST"
                operator: OPERATOR_NE
                value: "POST"
                
          - rules:
            - name: "block ip"
              condition:
                source: FIELD_SOURCE_IP
                key: "1.1.1.1"
                operator: OPERATOR_EQ
                value: "1.1.1.1"
      action:
        type: ACTION_TYPE_BLOCK

    isRateLimitOn: true
    timeWindow: 5s
    limit: 50
    timeout: 5s

  # ----------------------------------------------------------
  # CONTROLLER — THROTTLING, WAITING ROOM
  # ----------------------------------------------------------
  # Controls request flow, concurrency limits, and queuing
  # during high-traffic periods.
  # ----------------------------------------------------------
  controller:
    # maxConcurrent: 500               # Maximum concurrent users
    # waitingRoom:
    #   enabled: true
    #   message: "Server is busy, please wait..."  # Message shown to waiting users
    {}

  # ----------------------------------------------------------
  # PERSONALIZATION — USER CUSTOMIZATION
  # ----------------------------------------------------------
  # Allows per-user customization at the edge layer
  # for theme, language, and request headers.
  # ----------------------------------------------------------
  personal:
    # theme: "dark"                    # UI theme preference
    # language: "en"                   # Preferred language
    # customHeader:                    # Custom HTTP headers
    #   X-User-Type: "premium"
    {}
