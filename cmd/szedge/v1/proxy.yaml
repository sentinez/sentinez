# ----------------------------------------------------------
# EDGE SETTINGS PER USER
# ----------------------------------------------------------
# Defines how the edge proxy behaves for each user or tenant.
# Includes routing configuration, security policies,
# traffic control rules, and user personalization.
# ----------------------------------------------------------
setting:
  # ----------------------------------------------------------
  # METADATA — DEBUG & OBSERVABILITY
  # ----------------------------------------------------------
  # Contains configuration metadata for monitoring,
  # versioning, and debugging purposes.
  # ----------------------------------------------------------
  metadata:
    # Id of this proxy.yaml, filled into the logs of its requests as
    # tenant_id. Also the key the setting is synced between the edges by;
    # without one, or with the default tnt_default, it stays on this edge
    # only. Default: tnt_default
    tenantId: tnt_default_admin
    # Name and plan (PLAN_FREE | PLAN_STANDARD | PLAN_PRO) of the tenant
    # szapiserver imports this file under. Default name: tenantId
    tenantName: admin
    plan: PLAN_PRO

  # ----------------------------------------------------------
  # INGRESS — ROUTING CONFIGURATION
  # ----------------------------------------------------------
  # Defines where incoming requests are forwarded to
  # and how URLs are rewritten before reaching the origin server.
  # ----------------------------------------------------------
  ingress:
    resource:
      name: badcheese # Display name of the resource
      # Domain the resource is served at (required): the namespace of this
      # setting, the edge serves the requests whose Host is this domain
      # with it. szapiserver stores it as the domain of the resource.
      domain: badcheese.is.s6z.io.vn
      # Id of the resource, filled into the logs of its requests as
      # resource_id. Default: rsrc_default
      id: rsrc_default
      locations:
        - location: / # URL prefix to match incoming requests
          proxyRewrite: / # (Optional) rewrite prefix before forwarding
          proxyPass: # Destination origin upstream(s)
            - server: finorio.demo.nextjstemplates.com
              protocol: PROXY_PROTOCOL_HTTPS
          balanceStrategy: BALANCE_STRATEGY_ROUND_ROBIN
          proxySetHeaders:
            Host: $host
            X-Real-IP: $remote_addr
            X-Forwarded-For: $proxy_add_x_forwarded_for
            X-Forwarded-Proto: $scheme
            X-Forwarded-Host: $host

        # Example 1:
        - location: /local
          proxyRewrite: /
          proxyPass:
            - server: sentinez.upstream
              protocol: PROXY_PROTOCOL_HTTP

        # Example 2:
        - location: /api
          proxyRewrite: /
          proxyPass:
            - server: finorio.demo.nextjstemplates.com
              protocol: PROXY_PROTOCOL_HTTPS
          proxySetHeaders:
            X-Original-Path: $request_uri
            X-Forwarded-Prefix: /api

      # --------------------------------------------------------
      # EXAMPLE: NEWS NAMESPACE
      # --------------------------------------------------------
      # name: news
      # domain: news.is.s6z.io.vn
      # listen:
      #   - 80
      # locations:
      #   - location: /
      #     proxyPass:
      #       - server: badcheese.com
      #         protocol: 1
      # --------------------------------------------------------

  # ----------------------------------------------------------
  # SECURITY — WAF, RATE LIMIT, BOT DEFENSE
  # ----------------------------------------------------------
  # Defines Web Application Firewall (WAF) rules,
  # rate limiting thresholds, and bot detection policies
  # for each user or tenant.
  # ----------------------------------------------------------
  security:
    # Rulesets of the namespace: OWASP CRS and managed rulesets.
    ruleset:
      status: STATUS_ACTIVE
      # PROVIDER_OWASP (default) runs the CRS below | PROVIDER_MANAGED
      # (managed ruleset, not loaded by the edge yet).
      provider: PROVIDER_OWASP
      # OWASP Core Rule Set (CRS).
      crs:
        # ENGINE_MODE_OFF | ENGINE_MODE_DETECTION_ONLY (log only) |
        # ENGINE_MODE_ON (block)
        mode: ENGINE_MODE_ON
        # CRS_VERSION_V4_16_0 (no 956 Ruby group) | CRS_VERSION_V4_17_0 (default)
        version: CRS_VERSION_V4_17_0

        # 1 (fewest false positives) .. 4 (strictest).
        paranoiaLevel: 1
        # Rules up to this level are logged but only count toward
        # blocking up to paranoiaLevel. 0 = same as paranoiaLevel.
        detectionParanoiaLevel: 2

        # Anomaly score needed to block; a critical match scores 5.
        # 0 keeps the value of setup.conf (inbound 10, outbound 5).
        threshold:
          inbound: 5
          outbound: 4
          earlyBlocking: true

        # Enabled rule groups, empty = all.
        categories:
          - CATEGORY_METHOD_ENFORCEMENT    # 911
          - CATEGORY_SCANNER_DETECTION     # 913
          - CATEGORY_PROTOCOL_ENFORCEMENT  # 920
          - CATEGORY_PROTOCOL_ATTACK       # 921
          - CATEGORY_LFI                   # 930
          - CATEGORY_RFI                   # 931
          - CATEGORY_RCE                   # 932
          - CATEGORY_XSS                   # 941
          - CATEGORY_SQLI                  # 942
          # - CATEGORY_COMMON_EXCEPTIONS   # 905
          # - CATEGORY_MULTIPART_ATTACK    # 922
          # - CATEGORY_PHP                 # 933
          # - CATEGORY_GENERIC             # 934
          # - CATEGORY_SESSION_FIXATION    # 943
          # - CATEGORY_JAVA                # 944
          # - CATEGORY_DATA_LEAKAGES       # 950 (response)
          # - CATEGORY_DATA_LEAKAGES_SQL   # 951 (response)
          # - CATEGORY_DATA_LEAKAGES_JAVA  # 952 (response)
          # - CATEGORY_DATA_LEAKAGES_PHP   # 953 (response)
          # - CATEGORY_DATA_LEAKAGES_IIS   # 954 (response)
          # - CATEGORY_WEB_SHELLS          # 955 (response)
          # - CATEGORY_DATA_LEAKAGES_RUBY  # 956 (response)

        request:
          # Inspect request bodies (POST forms, JSON, XML).
          bodyAccess: true
          bodyLimitBytes: 13107200  # 12.5 MiB, 0 = default
          allowedMethods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
          # Empty keeps the content types of setup.conf.
          # allowedContentTypes:
          #   - application/json
          #   - application/x-www-form-urlencoded
          #   - multipart/form-data

        # False-positive tuning. Without an expression it applies to
        # the whole namespace, with one only to the requests matching
        # it (same syntax as secrules; the BODY, JA4 and TLS sources
        # are not supported).
        exclusions:
          # Skip every SQLi rule under /api/search.
          - tags: [attack-sqli]
            expr:
              orCondition:
                - rules:
                  - condition:
                      source: FIELD_SOURCE_PATH
                      operator: OPERATOR_PREFIX
                      value: "/api/search"
          # Do not inspect the "password" argument with rule 942100.
          - targets:
              - ruleId: 942100
                variable: ARGS:password
          # Skip the RCE rules for POSTs coming from 10.0.0.10.
          - tags: [attack-rce]
            expr:
              orCondition:
                - rules:
                  - condition:
                      source: FIELD_SOURCE_IP
                      key: "10.0.0.10"
                      operator: OPERATOR_EQ
                      value: "10.0.0.10"

                  - condition:
                      source: FIELD_SOURCE_METHOD
                      key: "POST"
                      operator: OPERATOR_EQ
                      value: "POST"

        # Per-rule state. Only DISABLED can be scoped to an expression
        # (same as exclusions), the other states are global.
        overrides:
          # Remove the rule under /webhook only.
          - id: 920420
            state: RULE_STATE_DISABLED
            expr:
              orCondition:
                - rules:
                  - condition:
                      source: FIELD_SOURCE_PATH
                      operator: OPERATOR_PREFIX
                      value: "/webhook"
          # Keep logging the rule, never count it toward blocking.
          - id: 942430
            state: RULE_STATE_DETECTION_ONLY
          # Force a paranoia level 2 rule on at paranoiaLevel 1.
          - id: 942130
            state: RULE_STATE_ENABLED

      # Managed ruleset, used with provider PROVIDER_MANAGED.
      # managed:
      #   mode: ENGINE_MODE_DETECTION_ONLY

    secrules:
      - ingress:
          name: "Complex Logic: (Path AND Method) OR IP"
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    operator: OPERATOR_EQ
                    value: "/block"

                - condition:
                    source: FIELD_SOURCE_METHOD
                    operator: OPERATOR_NE
                    value: "POST"

              - rules:
                - condition:
                    source: FIELD_SOURCE_IP
                    operator: OPERATOR_EQ
                    value: "1.1.1.1"
          action:
            type: ACTION_TYPE_BLOCK

      # Proof-of-work challenge: the client ticks a checkbox and its
      # browser solves a hash puzzle, then a pass cookie lets it
      # through for an hour. Only GETs are challenged, since the
      # client is sent back with a GET and a POST body would be lost.
      - ingress:
          name: "Challenge GET /login"
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    operator: OPERATOR_EQ
                    value: "/login"

                - condition:
                    source: FIELD_SOURCE_METHOD
                    operator: OPERATOR_EQ
                    value: "GET"
          action:
            type: ACTION_TYPE_CHALLENGE

      # Several or groups in one rule: (GET or HEAD) and (path /a or /b)
      # takes a second group in andCondition, which must match as well
      # (each element carries its own orCondition).
      - ingress:
          name: "Challenge GET/HEAD on /a or /b"
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - orCondition:
                  - rules:
                    - condition:
                        source: FIELD_SOURCE_METHOD
                        operator: OPERATOR_EQ
                        value: "GET"
                  - rules:
                    - condition:
                        source: FIELD_SOURCE_METHOD
                        operator: OPERATOR_EQ
                        value: "HEAD"
                andCondition:
                  - orCondition:
                      - rules:
                        - condition:
                            source: FIELD_SOURCE_PATH
                            operator: OPERATOR_PREFIX
                            value: "/a"
                      - rules:
                        - condition:
                            source: FIELD_SOURCE_PATH
                            operator: OPERATOR_PREFIX
                            value: "/b"
          action:
            type: ACTION_TYPE_CHALLENGE

      # Lua rule: a script in place of expr and action. It defines a
      # global match(ctx) returning nil or false (no match), an action
      # constant (SZ_BLOCK, SZ_CHALLENGE, SZ_REDIRECT, SZ_LOG,
      # SZ_MODIFY_HEADER, SZ_SET_TAG, SZ_ROUTE_TO), as an eBPF program
      # returns XDP_DROP, or a table {type = SZ_REDIRECT, params = {...}}.
      # ctx only reads the request here, and no ---@stage line is allowed.
      - ingress:
          name: "Script: block X-Debug"
          status: STATUS_ACTIVE
          script: |
            ---@param ctx sz.Context
            function match(ctx)
              if ctx:header("X-Debug") == "1" then
                return SZ_BLOCK
              end
            end

    # Every limiter needs an ingress expr or script: it only counts the
    # requests it matches (the edge refuses to start without). A script
    # defines key(ctx) returning true for the requests to count, under the
    # client IP: the edge converts it to its expr at load, as a secrule
    # script, and refuses one outside of the declarative form.
    limiters:
      - ingress:
          name: "Rate limit every path"
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    operator: OPERATOR_PREFIX
                    value: "/"
        timeWindow: 5s
        maxRequests: 100
        timeout: 5s
      - ingress:
          name: "Script: rate limit the login"
          status: STATUS_ACTIVE
          script: |
            ---@param ctx sz.Context
            function key(ctx)
              if ctx:path() == "/login" then
                return true
              end
            end
        timeWindow: 5s
        maxRequests: 20
        timeout: 5s

  # ----------------------------------------------------------
  # TRAFFIC CONTROL — THROTTLING, WAITING ROOM
  # ----------------------------------------------------------
  # Controls request flow, concurrency limits, and queuing
  # during high-traffic periods.
  # ----------------------------------------------------------
  traffic_control:
    # maxConcurrent: 500               # Maximum concurrent users
    # waitingRoom:
    #   message: "Server is busy, please wait..."  # Message shown to waiting users
    {}

  # ----------------------------------------------------------
  # DELIVERY — CDN, CACHING
  # ----------------------------------------------------------
  # Content delivery rules: which requests are cached at
  # the edge.
  # ----------------------------------------------------------
  delivery:
    cdn:
      - rule:
          name: cache request with condition
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_METHOD
                    key: "GET"
                    operator: OPERATOR_EQ
                    value: "GET"

                # Never cache the challenged page: the cache runs
                # before the secrules and would skip the challenge.
                - condition:
                    source: FIELD_SOURCE_PATH
                    key: "/login"
                    operator: OPERATOR_NE
                    value: "/login"


  # ----------------------------------------------------------
  # PERSONALIZATION — USER CUSTOMIZATION
  # ----------------------------------------------------------
  # Allows per-user customization at the edge layer
  # for theme, language, and request headers.
  # ----------------------------------------------------------
  personal:
    # theme: "dark"                    # UI theme preference
    # language: "en"                   # Preferred language
    # customHeader:                    # Custom HTTP headers
    #   X-User-Type: "premium"
    {}

  # ----------------------------------------------------------
  # SCRIPTING — LUA HOOKS
  # ----------------------------------------------------------
  # A ---@stage <phase>/<stage> line hooks the global function it
  # precedes, whatever its name, before or after a stage of the edge
  # chain, by plugin id: caching, secratelimit, waitingroom, staticassets,
  # secrule, secruleset, router (in chain order). One line per phase
  # and stage.
  # ctx reads the request (method, path, host, ip, header, query),
  # sets headers (set_header: sent upstream, set_response_header)
  # and answers it (respond(status, body), before only).
  # log.info(...) and log.debug(...) (or log:info, log:debug) write to
  # the logs of the request.
  # A script that fails is skipped; each call has a 50ms limit.
  # Editor types: staging/src/github.com/sentinez/scripting/meta
  # (LuaLS), annotate the hooks with ---@param ctx sz.Context.
  # ----------------------------------------------------------
  scripting:
    scripts:
      - id: "script_example"
        name: "tag requests"
        source: |
          ---@stage http.request/router
          ---@param ctx sz.Context
          function tag_edge(ctx)
            log.debug("tag", ctx:host(), ctx:path())
            ctx:set_header("X-Edge", "sentinez")
          end
