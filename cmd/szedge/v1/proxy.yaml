# ----------------------------------------------------------
# EDGE SETTINGS PER USER
# ----------------------------------------------------------
# Defines how the edge proxy behaves for each user or tenant.
# Includes routing configuration, security policies,
# traffic control rules, and user personalization.
# ----------------------------------------------------------
setting:
  # ----------------------------------------------------------
  # METADATA — DEBUG & OBSERVABILITY
  # ----------------------------------------------------------
  # Contains configuration metadata for monitoring,
  # versioning, and debugging purposes.
  # ----------------------------------------------------------
  metadata:
    # version: "v1"                    # Configuration version
    # owner: "hunghd"                  # Maintainer or tenant identifier
    # traceId: "abc123"                # Optional trace ID for tracking
    {}

  # ----------------------------------------------------------
  # SERVER — ROUTING CONFIGURATION
  # ----------------------------------------------------------
  # Defines where incoming requests are forwarded to
  # and how URLs are rewritten before reaching the origin server.
  # ----------------------------------------------------------
  server:
    name: badcheese # Logical namespace grouping related routes
    locations:
      - location: / # URL prefix to match incoming requests
        proxyRewrite: / # (Optional) rewrite prefix before forwarding
        proxyPass: # Destination origin upstream(s)
          - server: finorio.demo.nextjstemplates.com
            protocol: PROXY_PROTOCOL_HTTPS
        balanceStrategy: BALANCE_STRATEGY_ROUND_ROBIN
        proxySetHeaders:
          Host: $host
          X-Real-IP: $remote_addr
          X-Forwarded-For: $proxy_add_x_forwarded_for
          X-Forwarded-Proto: $scheme
          X-Forwarded-Host: $host

      # Example 1:
      - location: /local
        proxyRewrite: /
        proxyPass:
          - server: 127.0.0.1
            protocol: PROXY_PROTOCOL_HTTP

      # Example 2:
      - location: /api
        proxyRewrite: /
        proxyPass:
          - server: finorio.demo.nextjstemplates.com
            protocol: PROXY_PROTOCOL_HTTPS
        proxySetHeaders:
          X-Original-Path: $request_uri
          X-Forwarded-Prefix: /api

    # --------------------------------------------------------
    # EXAMPLE: NEWS NAMESPACE
    # --------------------------------------------------------
    # name: news
    # listen:
    #   - 80
    # locations:
    #   - location: /
    #     proxyPass:
    #       - server: badcheese.com
    #         protocol: 1
    # --------------------------------------------------------

  # ----------------------------------------------------------
  # SECURITY — WAF, RATE LIMIT, BOT DEFENSE
  # ----------------------------------------------------------
  # Defines Web Application Firewall (WAF) rules,
  # rate limiting thresholds, and bot detection policies
  # for each user or tenant.
  # ----------------------------------------------------------
  security:
    # OWASP Core Rule Set (CRS), one configuration per namespace.
    core_ruleset:
      status: STATUS_ACTIVE
      # ENGINE_MODE_OFF | ENGINE_MODE_DETECTION_ONLY (log only) |
      # ENGINE_MODE_ON (block)
      mode: ENGINE_MODE_ON
      # VERSION_V4_16_0 (no 956 Ruby group) | VERSION_V4_17_0 (default)
      version: VERSION_V4_17_0

      # 1 (fewest false positives) .. 4 (strictest).
      paranoiaLevel: 1
      # Rules up to this level are logged but only count toward
      # blocking up to paranoiaLevel. 0 = same as paranoiaLevel.
      detectionParanoiaLevel: 2

      # Anomaly score needed to block; a critical match scores 5.
      # 0 keeps the value of setup.conf (inbound 10, outbound 5).
      threshold:
        inbound: 5
        outbound: 4
        earlyBlocking: true

      # Enabled rule groups, empty = all.
      categories:
        - CATEGORY_METHOD_ENFORCEMENT    # 911
        - CATEGORY_SCANNER_DETECTION     # 913
        - CATEGORY_PROTOCOL_ENFORCEMENT  # 920
        - CATEGORY_PROTOCOL_ATTACK       # 921
        - CATEGORY_LFI                   # 930
        - CATEGORY_RFI                   # 931
        - CATEGORY_RCE                   # 932
        - CATEGORY_XSS                   # 941
        - CATEGORY_SQLI                  # 942
        # - CATEGORY_COMMON_EXCEPTIONS   # 905
        # - CATEGORY_MULTIPART_ATTACK    # 922
        # - CATEGORY_PHP                 # 933
        # - CATEGORY_GENERIC             # 934
        # - CATEGORY_SESSION_FIXATION    # 943
        # - CATEGORY_JAVA                # 944
        # - CATEGORY_DATA_LEAKAGES       # 950 (response)
        # - CATEGORY_DATA_LEAKAGES_SQL   # 951 (response)
        # - CATEGORY_DATA_LEAKAGES_JAVA  # 952 (response)
        # - CATEGORY_DATA_LEAKAGES_PHP   # 953 (response)
        # - CATEGORY_DATA_LEAKAGES_IIS   # 954 (response)
        # - CATEGORY_WEB_SHELLS          # 955 (response)
        # - CATEGORY_DATA_LEAKAGES_RUBY  # 956 (response)

      request:
        # Inspect request bodies (POST forms, JSON, XML).
        bodyAccess: true
        bodyLimitBytes: 13107200  # 12.5 MiB, 0 = default
        allowedMethods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
        # Empty keeps the content types of setup.conf.
        # allowedContentTypes:
        #   - application/json
        #   - application/x-www-form-urlencoded
        #   - multipart/form-data

      # False-positive tuning. Without an expression it applies to
      # the whole namespace, with one only to the requests matching
      # it (same syntax as sec_rules; the BODY, JA4 and TLS sources
      # are not supported).
      exclusions:
        # Skip every SQLi rule under /api/search.
        - tags: [attack-sqli]
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    operator: OPERATOR_PREFIX
                    value: "/api/search"
        # Do not inspect the "password" argument with rule 942100.
        - targets:
            - ruleId: 942100
              variable: ARGS:password
        # Skip the RCE rules for POSTs coming from 10.0.0.10.
        - tags: [attack-rce]
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_IP
                    key: "10.0.0.10"
                    operator: OPERATOR_EQ
                    value: "10.0.0.10"

                - condition:
                    source: FIELD_SOURCE_METHOD
                    key: "POST"
                    operator: OPERATOR_EQ
                    value: "POST"

      # Per-rule state. Only DISABLED can be scoped to an expression
      # (same as exclusions), the other states are global.
      overrides:
        # Remove the rule under /webhook only.
        - id: 920420
          state: RULE_STATE_DISABLED
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    operator: OPERATOR_PREFIX
                    value: "/webhook"
        # Keep logging the rule, never count it toward blocking.
        - id: 942430
          state: RULE_STATE_DETECTION_ONLY
        # Force a paranoia level 2 rule on at paranoiaLevel 1.
        - id: 942130
          state: RULE_STATE_ENABLED

    sec_rules:
      - ingress:
          name: "Complex Logic: (Path AND Method) OR IP"
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_PATH
                    key: "/block"
                    operator: OPERATOR_EQ
                    value: "/block"

                - condition:
                    source: FIELD_SOURCE_METHOD
                    key: "POST"
                    operator: OPERATOR_NE
                    value: "POST"

              - rules:
                - condition:
                    source: FIELD_SOURCE_IP
                    key: "1.1.1.1"
                    operator: OPERATOR_EQ
                    value: "1.1.1.1"
          action:
            type: ACTION_TYPE_BLOCK

    limiters:
      - timeWindow: 5s
        maxRequests: 500
        timeout: 5s

  # ----------------------------------------------------------
  # TRAFFIC CONTROL — THROTTLING, WAITING ROOM
  # ----------------------------------------------------------
  # Controls request flow, concurrency limits, and queuing
  # during high-traffic periods.
  # ----------------------------------------------------------
  traffic_control:
    # maxConcurrent: 500               # Maximum concurrent users
    # waitingRoom:
    #   message: "Server is busy, please wait..."  # Message shown to waiting users
    {}

  # ----------------------------------------------------------
  # DELIVERY — CDN, CACHING
  # ----------------------------------------------------------
  # Content delivery rules: which requests are cached at
  # the edge.
  # ----------------------------------------------------------
  delivery:
    cdn:
      - rule:
          name: cache request with condition
          status: STATUS_ACTIVE
          expr:
            orCondition:
              - rules:
                - condition:
                    source: FIELD_SOURCE_METHOD
                    key: "GET"
                    operator: OPERATOR_EQ
                    value: "GET"


  # ----------------------------------------------------------
  # PERSONALIZATION — USER CUSTOMIZATION
  # ----------------------------------------------------------
  # Allows per-user customization at the edge layer
  # for theme, language, and request headers.
  # ----------------------------------------------------------
  personal:
    # theme: "dark"                    # UI theme preference
    # language: "en"                   # Preferred language
    # customHeader:                    # Custom HTTP headers
    #   X-User-Type: "premium"
    {}
