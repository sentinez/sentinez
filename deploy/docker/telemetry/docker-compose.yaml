# OpenTelemetry Collector + Kafka UI. Kafka itself lives in
# deploy/docker/docker-compose.yaml (sentinez.kafka); start it first, these
# services join its sentinez-network.
# The edge produces its traffic events straight to Kafka when
# SENZ_KAFKA_BROKERS=sentinez.kafka:9094 (raw proto, sentinez.event.http.*).
# Otherwise services export OTLP to the collector when
# SENZ_OTLP_INTERNAL_ENDPOINT (system logs) / SENZ_OTLP_EXTERNAL_ENDPOINT
# (edge traffic logs) point at sentinez.telemetry.otel-collector:4317; the
# collector pushes logs, traces and metrics to Kafka (edge traffic logs to sentinez.event.http.*.otlp).
#
#   docker compose -f deploy/docker/telemetry/docker-compose.yaml up -d
services:
  # sentinez.telemetry.otel-collector:
  #   image: otel/opentelemetry-collector-contrib:0.115.1
  #   container_name: sentinez.telemetry.otel-collector
  #   hostname: sentinez.telemetry.otel-collector
  #   restart: unless-stopped

  #   command:
  #     - --config=/etc/otelcol-contrib/config.yaml

  #   volumes:
  #     - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  #   ports:
  #     - "4317:4317" # OTLP gRPC
  #     - "4318:4318" # OTLP HTTP
  #     - "13133:13133" # health check

  #   networks:
  #     - sentinez-network

  # Web UI to browse topics and messages: http://sentinez.telemetry.kafka-ui:8088
  sentinez.telemetry.kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: sentinez.telemetry.kafka-ui
    restart: unless-stopped

    ports:
      - "8088:8080"

    environment:
      SPRING_CONFIG_ADDITIONAL-LOCATION: /etc/kafkaui/config.yaml

    volumes:
      - ./kafka-ui.yaml:/etc/kafkaui/config.yaml:ro
      # OTLP .proto files for decoding (imports are opentelemetry/proto/...)
      - ../../../api/third_party/opentelemetry:/protofiles/opentelemetry:ro
      # event .proto files of the raw sentinez.event.http.* topics
      - ../../../api/proto/sentinez/types/v1:/protofiles/sentinez/types/v1:ro
      - ../../../api/proto/sentinez/types/rule/v1:/protofiles/sentinez/types/rule/v1:ro
      - ../../../api/proto/sentinez/types/secrule/v1:/protofiles/sentinez/types/secrule/v1:ro
      - ../../../api/proto/sentinez/types/coreruleset/v1:/protofiles/sentinez/types/coreruleset/v1:ro
      - ../../../api/proto/sentinez/types/net/http/v1:/protofiles/sentinez/types/net/http/v1:ro
      - ../../../api/third_party/protovalidate/proto/protovalidate/buf:/protofiles/buf:ro

    networks:
      - sentinez-network

networks:
  sentinez-network:
    external: true
