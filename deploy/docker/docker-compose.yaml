  sentinez.timescale:
    image: timescale/timescaledb:latest-pg16
    hostname: sentinez.timescale
    container_name: sentinez.timescale
    ports:
      - "5432:5432"
    restart: on-failure:3
    env_file:
      - timescale.env
    volumes:
      - ./volume/timescale:/var/lib/postgresql/data
    networks:
      - sentinez-network

  # sentinez.postgres:
  #   image: postgres:16
  #   container_name: sentinez.postgres
