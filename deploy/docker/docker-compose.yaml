  sentinez.postgres:
    image: postgres:16
    container_name: sentinez.postgres
    hostname: sentinez.postgres
    ports:
      - "5432:5432"
    restart: on-failure:3
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sentinez
    volumes:
      - ./_volume/postgres:/var/lib/postgresql/data
    networks:
      - sentinez-network

  sentinez.consul:
    image: hashicorp/consul:latest
    container_name: sentinez.consul
    hostname: sentinez.consul
    restart: on-failure:3
    ports:
      - "8500:8500"   # UI & API
      - "8600:8600/udp" # DNS
    command: "agent -dev -client=0.0.0.0"
    volumes:
      - ./_volume:/consul/data
    networks:
      - sentinez-network

  # sentinez.nats:
  #   image: nats:latest
  #   hostname: sentinez.nats
  #   container_name: sentinez.nats
  #   ports:
  #     - "4222:4222"  # client port
  #     - "8222:8222"  # monitoring port
  #   # command: -js # Enable JetStream

  sentinez.apiserver:
    image: sentinez/apiserver:latest
    hostname: sentinez.apiserver
    container_name: sentinez.apiserver
    restart: on-failure:3
    environment:
      - SENZ_POSTGRES_URI=postgres://root:root@sentinez.postgres:5432/sentinez?sslmode=disable
    ports:
      - "8080:8080"
    networks:
      - sentinez-network
    env_file:
      - ../../cmd/apiserver/.env
    depends_on:
      - sentinez.postgres
  
  sentinez.edge:
    image: sentinez/edge:latest
    hostname: sentinez.edge
    container_name: sentinez.edge
    restart: on-failure:3
    ports:
      - "7443:7443" # HTTPS connection
      # - "8443:8443" # gRPC connection
    networks:
      - sentinez-network
    env_file:
      - ../../cmd/edge/v1/.env

volumes:
  _volume:

networks:
  sentinez-network:
    driver: bridge