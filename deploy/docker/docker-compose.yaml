  sentinez.consul:
    image: hashicorp/consul:latest
    container_name: sentinez.consul
    hostname: sentinez.consul
    restart: on-failure:3
    ports:
      - "8500:8500"   # UI & API
      - "8600:8600/udp" # DNS
    # single-node server: -dev keeps everything in memory, so the KV
    # (sentinez/proxy.yaml) was lost on every restart. The image adds
    # -data-dir=/consul/data, persisted by the volume below
    command: >-
      agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
      -node=sentinez-consul
    volumes:
      - ./volume/consul:/consul/data
    networks:
      - sentinez-network

