services:
  sentinez.dmz.edge.01:
    image: sentinez/edge:latest
    container_name: sentinez.dmz.edge.01
    env_file:
      - ../../../cmd/szedge/v1/.env
    environment:
      - SENZ_MEMBERSHIP_ADDRESS=sentinez-edge-02:7777
      - SENZ_DISCOVERY_ADDRESS=0.0.0.0:7777
    networks:
      - sentinez-net
    ports:
      - "7443:7443"
      - "7443:7443/udp"

  sentinez.dmz.edge.02:
    image: sentinez/edge:latest
    container_name: sentinez.dmz.edge.02
    env_file:
      - ../../../cmd/szedge/v1/.env
    networks:
      - sentinez-net
    environment:
      - SENZ_MEMBERSHIP_ADDRESS=sentinez-edge-01:7777
      - SENZ_DISCOVERY_ADDRESS=0.0.0.0:7777
    depends_on:
      - sentinez-edge-01
    ports:
      - "8443:8443"
      - "8443:8443/udp"

networks:
  sentinez-net:
    driver: bridge