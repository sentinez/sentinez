services:
  # dev-mode single server: run 3 or 5 Consul servers in production, so
  # the leader lock survives the loss of one.
  sentinez.consul:
    image: hashicorp/consul:1.20
    container_name: sentinez.consul
    command: agent -dev -client=0.0.0.0
    networks:
      - sentinez-net
    ports:
      - "8500:8500"

  sentinez.dmz.edge.01:
    image: sentinez/edge:latest
    container_name: sentinez.dmz.edge.01
    env_file:
      - ../../../cmd/szedge/v1/.env
    environment:
      - SENZ_MEMBERSHIP_ADDRESS=sentinez.dmz.edge.02:7777
      - SENZ_DISCOVERY_ADDRESS=0.0.0.0:7777
      - SENZ_CONSUL_URI=sentinez.consul:8500
      - SENZ_ZONE=SGN
    depends_on:
      - sentinez.consul
    networks:
      - sentinez-net
    ports:
      - "7443:7443"
      - "7443:7443/udp"

  sentinez.dmz.edge.02:
    image: sentinez/edge:latest
    container_name: sentinez.dmz.edge.02
    env_file:
      - ../../../cmd/szedge/v1/.env
    environment:
      - SENZ_MEMBERSHIP_ADDRESS=sentinez.dmz.edge.01:7777
      - SENZ_DISCOVERY_ADDRESS=0.0.0.0:7777
      - SENZ_CONSUL_URI=sentinez.consul:8500
      - SENZ_ZONE=SGN
    depends_on:
      - sentinez.consul
      - sentinez.dmz.edge.01
    networks:
      - sentinez-net
    ports:
      - "8443:8443"
      - "8443:8443/udp"

networks:
  sentinez-net:
    driver: bridge
