global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus monitor
  - job_name: prometheus
    static_configs:
      - targets: ['sentinez.monitoring.prometheus:9090']

  # Docker container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ['sentinez.monitoring.cadvisor:8080']
    
    metric_relabel_configs:
      - source_labels: ['name']
        regex: '/sentinez.monitoring.*|sentinez.monitoring.*'
        action: drop

      - source_labels: ['name']
        target_label: 'container'
