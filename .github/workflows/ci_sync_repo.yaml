name: CI / Sync Git Repo

permissions:
  contents: write

on:
  push:
    branches:
      - staging
      - main

jobs:
  sync:
    name: Run sync repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Git identity
        run: |
          git config user.name "Duc-Hung Ho"
          git config user.email "iduchungho@gmail.com"

      - name: Add permission to script
        run: |
          chmod +x ./hack/git/staging-ci
      
      - name: Sync git repo - Core
        run: |
          TOKEN=${{ secrets.SENZ_GITHUB_TOKEN }}
          REMOTE=https://${TOKEN}@github.com/sentinez/core.git
          ./hack/git/staging-ci core ${REMOTE}
