name: CI / sync sentinez

permissions:
  contents: write

on:
  push:
    branches:
      - staging
      - main

jobs:
  core:
    name: sync sentinez/core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync sentinez/core
        env:
          SENZ_GITHUB_TOKEN: ${{ secrets.SENZ_GITHUB_TOKEN }}
        run: bash hack/ci/action_sync.sh core

  shared:
    name: sync sentinez/shared
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync sentinez/shared
        env:
          SENZ_GITHUB_TOKEN: ${{ secrets.SENZ_GITHUB_TOKEN }}
        run: bash hack/ci/action_sync.sh shared

  tools:
    name: sync sentinez/tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync sentinez/tools
        env:
          SENZ_GITHUB_TOKEN: ${{ secrets.SENZ_GITHUB_TOKEN }}
        run: bash hack/ci/action_sync.sh tools

  x:
    name: sync sentinez/x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync sentinez/x
        env:
          SENZ_GITHUB_TOKEN: ${{ secrets.SENZ_GITHUB_TOKEN }}
        run: bash hack/ci/action_sync.sh x
