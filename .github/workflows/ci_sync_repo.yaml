name: CI / sync sentinez

permissions:
  contents: write

on:
  push:
    branches:
      - staging
      - main

jobs:
  core:
    name: sync sentinez/core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync sentinez/core
        env:
          SZ_GITHUB_TOKEN: ${{ secrets.SZ_GITHUB_TOKEN }}
        run: bash hack/ci/action_sync.sh core

  pkg:
    name: sync sentinez/pkg
    runs-on: ubuntu-latest

