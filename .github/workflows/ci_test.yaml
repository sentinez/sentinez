name: CI / Test

on:
  # only the pull requests into main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run go test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.0"

      - name: go test
        run: |
          bash ./hack/gotest.sh
