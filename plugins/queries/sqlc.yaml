    gen:
      go:
        package: "news"
        out: "gen/news"
        sql_package: "pgx/v5"
        emit_json_tags: true

  - engine: "postgresql"
    queries: "sql/users.query.sql"
    schema: "sql/users.schema.sql"
    gen:
      go:
        package: "users"
        out: "gen/users"
        sql_package: "pgx/v5"
        emit_json_tags: true