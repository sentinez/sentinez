version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/authors.query.sql"
    schema: "sql/authors.schema.sql"
    gen:
      go:
        package: "authors"
        out: "gen/authors"
        sql_package: "pgx/v5"
        emit_json_tags: true

  - engine: "postgresql"
    queries: "sql/news.query.sql"
